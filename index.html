/* ---- subtasks: cadence + carryover ---- */
function visibleSubtasks(c, dk){
  const mem = (state.data.subMemory[c.id]) || {};
  const vis = c.subtasks.filter(st=>{
    if(!st.cadDays) return true;
    const m = mem[st.n];
    return !m?.lastShown || daysBetween(m.lastShown, dk) >= st.cadDays;
  });
  // carryover: shown last time but unchecked -> float to top
  return vis.sort((a,b)=> (carried(c,b)?1:0) - (carried(c,a)?1:0));
}
function carried(c, st){
  const m = state.data.subMemory[c.id]?.[st.n];
  return m && m.lastShown && (!m.lastChecked || m.lastChecked < m.lastShown);
}

/* ---- state machine ---- */
function prunePhoto(inst){ if(inst.photo){ inst.photoProvided=true; delete inst.photo; } } // evidence for review, not an archive
function transition(data, inst, action, actorId){
  const c = data.registry.find(x=>x.id===inst.cid);
  const now = new Date().toISOString();
  if(action==="claim" && inst.state==="open"){ inst.state="in_process"; inst.claimedBy=actorId; inst.startedAt=now; }
  else if(action==="start" && !inst.startedAt){ inst.startedAt=now; }
  else if(action==="done" && inst.state!=="done" && inst.state!=="verified"){
    resumeIfPaused(inst);
    inst.state="done"; inst.completedAt=now; if(!inst.startedAt) inst.startedAt=now;
    const selfAcc = !c?.accountable || c.accountable===inst.pid || adultToAdult(data,c,inst);
    if(selfAcc){ inst.state="verified"; inst.verifiedAt=now; inst.selfVerified=true; prunePhoto(inst);
      if(adultToAdult(data,c,inst)) data.log.push({t:now, msg:`${nameOf(inst.pid)} completed “${c.name}” — FYI ${nameOf(c.accountable)}`});
    }
    awardIfDue(data, inst, "tap");
    if(inst.state==="verified") awardIfDue(data, inst, "verify");
  }
  else if(action==="verify" && inst.state==="done"){
    inst.state="verified"; inst.verifiedAt=now; inst.verifiedBy=actorId; prunePhoto(inst);
    awardIfDue(data, inst, "verify");
    if(c?.followup) data.instances.push({id:uid("i"), cid:c.followup.taskId, pid:c.followup.assignee, date:inst.date, state:"in_process", startedAt:now});
  }
  else if(action==="return" && inst.state==="done"){ // Returned: back to in_process; the star derived from this occurrence drops with it
    inst.state="in_process"; inst.returnedAt=now; inst.returnedBy=actorId; inst.returnedCount=(inst.returnedCount||0)+1;
    delete inst.completedAt; delete inst.starred; delete inst.starsEarned; prunePhoto(inst); delete inst.photoProvided;
    data.log.push({t:now, msg:`“${c?.name}” sent back to ${nameOf(starOwner(inst))}${inst.returnNote?`: ${inst.returnNote}`:""}`});
  }
  else if(action==="skip"){ inst.state="skipped"; }
  // record subtask memory at completion
  if((action==="done") && c?.subtasks && inst.subChecks){
    const vis = visibleSubtasks(c, inst.date);
    data.subMemory[c.id] = data.subMemory[c.id]||{};
    vis.forEach((st,i)=>{ const m = data.subMemory[c.id][st.n] = data.subMemory[c.id][st.n]||{};
      m.lastShown = inst.date; if(inst.subChecks[i]) m.lastChecked = inst.date; });
  }
}
function adultToAdult(data,c,inst){
  const acc = data.people.find(p=>p.id===c?.accountable), asg = data.people.find(p=>p.id===inst.pid);
  return acc && asg && acc.role==="adult" && asg.role==="adult" && acc.id!==asg.id;
}
function awardIfDue(data, inst, moment, silent){
  const c = data.registry.find(x=>x.id===inst.cid);
  if(!c || !c.stars || inst.starred) return;
  const mode = c.starsOn || data.settings.starsOnDefault;
  if(mode!==moment) return;
  inst.starred = true; inst.starsEarned = c.stars; // earned stars live on the occurrence; balances derive from here
  const owner=starOwner(inst), kid=data.people.find(p=>p.id===owner);
  if(kid?.role==="child"){ checkStarGoals(data, owner); if(!silent) uiStarPop(owner, c.stars); }
}
function completeRoutine(data, rInst, r){
  if(rInst.state==="verified") return;
  rInst.checks = rInst.checks.map(()=>true);
  rInst.state="verified"; rInst.completedAt=new Date().toISOString();
  if(r.starMode==="whole" && r.stars && data.people.find(p=>p.id===rInst.pid)?.role==="child"){
    rInst.starsEarned=r.stars; checkStarGoals(data, rInst.pid); uiStarPop(rInst.pid, r.stars);

function quotaStatus(data, c, date){

function ledger(data, date){

/* =========================================================================
   STORAGE — artifact persistent storage with JSON import/export fallback
   ========================================================================= */
const BUILD="v0.34 · adult recap in day order";
const state = { lunch:null, data:null, view:"kids", now:new Date(), page:null, cursor:new Date(), adultMode:"day", mp:null, am:null, rp:null };

const KEY="contributions-v1";
let storageMode="memory", warnedNoSave=false;
async function loadData(){
  // Trust no storage tier until it passes a real round-trip.
  if(window.storage && typeof window.storage.set==="function"){
    try{
      await window.storage.set("probe-key","ok");
      const p=await window.storage.get("probe-key");
      if(p && p.value==="ok"){
        storageMode="artifact";
        try{ await window.storage.delete("probe-key"); }catch(e){}
        try{ const r=await window.storage.get(KEY); if(r?.value){ state.data=JSON.parse(r.value); return; } }
        catch(e){/* no saved board yet — fresh start */}
      }
    }catch(e){/* storage API present but not usable here — fall through */}
  }
  if(storageMode!=="artifact"){
    try{ localStorage.setItem("__probe","1"); localStorage.removeItem("__probe");
      storageMode="local";
      const v=localStorage.getItem(KEY); if(v){ state.data=JSON.parse(v); return; }
    }catch(e){ storageMode="memory"; }
  }
  state.data = DEFAULT_DATA();
}
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{
  const json=JSON.stringify(state.data);
  if(cloud.ready) cloudPush();
  if(storageMode==="artifact"){
    try{ await window.storage.set(KEY, json); return; }
    catch(e){ storageMode="local"; } // demote once, never retry a broken tier
  }
  if(storageMode==="local"){
    try{ localStorage.setItem(KEY, json); return; }
    catch(e){ storageMode="memory"; }
  }
  if(!warnedNoSave){ warnedNoSave=true;
    toast("Auto-save isn't available here — use Export JSON before closing"); }
},400); }

function elapsedMs(inst){
  if(!inst.startedAt) return 0;
  const end = inst.pausedAt ? new Date(inst.pausedAt) : new Date();
  return Math.max(0, end - new Date(inst.startedAt) - (inst.pausedMs||0));
}
function resumeIfPaused(inst){
  if(inst.pausedAt){ inst.pausedMs=(inst.pausedMs||0)+(Date.now()-new Date(inst.pausedAt)); delete inst.pausedAt; }
}
function fmtTimer(inst, c){
  if(!inst.startedAt || inst.state==="done"||inst.state==="verified") return "";
  const el=Math.floor(elapsedMs(inst)/1000);
  const tgt=(c.timerMin??c.estMin)*60;
  const rem=tgt-el, sign=rem<0?"+":"", v=Math.abs(rem);
  const mm=String(Math.floor(v/60)).padStart(2,"0"), ss=String(v%60).padStart(2,"0");
  return `<span class="timer ${rem<0?'up':''} ${inst.pausedAt?'paused':''}">${rem<0?'⏱ '+sign:''}${mm}:${ss}</span>
    <button class="pausebtn" aria-label="${inst.pausedAt?'Resume timer':'Pause timer'}" onclick="togglePause(${iid(inst)})">${inst.pausedAt?"▶":"⏸"}</button>
    <div class="tbar"><i style="width:${Math.min(100,el/tgt*100)}%"></i></div>`;
}
function timerGateOpen(inst,c){

  if(!inst.startedAt) return false;
  return elapsedMs(inst)/60000 >= (c.timerMin??c.estMin);

window.saveTask=(id)=>{
  const D=state.data, isNew=id==="new";
  const name=$("#t_name").value.trim();
  if(!name){ toast("Give it a name"); return; }
  const c = isNew ? {id:uid("c_")} : D.registry.find(x=>x.id===id);
  const inRoutine=D.routines.some(r=>r.memberRefs?.includes(id));
  c.name=name; c.notes=$("#t_notes").value.trim();
  c.category=$("#t_cat").value; c.daypart=$("#t_daypart").value||undefined;
  if(!inRoutine){
    const type=$("#t_schtype").value;
    if(type==="fixed"){
      const days=[...document.querySelectorAll(".t_day:checked")].map(x=>+x.value);
      if(!days.length){ toast("Pick at least one day"); return; }
      c.schedule={type:"fixed", days};
      const ev=Math.max(1,parseInt($("#t_every").value)||1); if(ev>1){ c.schedule.everyWeeks=ev; c.schedule.anchor=$("#t_anchor").value||todayKey(state.now); }
    } else if(type==="quota") c.schedule={type:"quota", count:Math.max(1,parseInt($("#t_qcount").value)||1), period:$("#t_qperiod").value};
    else c.schedule={type:"once", date:$("#t_oncedate").value||todayKey(state.now)};
  }
  c.estMin=Math.max(0,parseInt($("#t_est").value)||0);
  const w=parseInt($("#t_wait").value); c.waitMin=isNaN(w)?undefined:w;
  const tm=parseInt($("#t_timer").value); c.timerMin=isNaN(tm)?undefined:tm;
  c.timerGate=$("#t_gate").checked||undefined;
  c.stars=Math.max(0,parseInt($("#t_stars").value)||0);
  c.starsOn=$("#t_starson").value||undefined;
  c.photoReq=$("#t_photo").checked||undefined;
  const how=$("#t_how").value;
  { const exp=$("#t_expect").checked, derived=how!=="open"&&how!=="participatory"; c.expectation = exp===derived ? undefined : (exp?"expected":"extra"); } // store only the override
  if(isExpected(c)&&involvesKid(D,c)){ // a must-do is anchored: it needs a block and fixed days
    if(!c.daypart){ toast("A must-do needs a daypart. Pick one, or untick Expected."); return; }
    if(!inRoutine&&c.schedule?.type==="quota"){ toast("A must-do needs fixed days, not a quota. Change the schedule, or untick Expected."); return; } }
  c.policy = how==="participatory" ? "open" : how;
  c.claimMode = how==="participatory" ? "participatory" : (how==="open" ? "exclusive" : undefined);
  c.assignees=[...document.querySelectorAll(".t_who:checked")].map(x=>x.value);
  if(c.policy==="static"&&!c.assignees.length){ toast("Pick at least one person"); return; }
  if(c.policy==="rotate"&&c.assignees.length<2){ toast("Rotation needs at least two people"); return; }
  delete c.assignee; delete c.perKid; delete c.roster; // legacy fields retired
  const roles=c.assignees.map(pid=>D.people.find(p=>p.id===pid)?.role);
  c.ownerType = roles.length && roles.every(r=>r==="adult") ? "adult" : roles.length && roles.every(r=>r==="vendor") ? "outsourced" : "child";
  c.accountable = needsAccountable(D,c) ? $("#t_acc").value : undefined; // adult-only tasks are self-accountable
  const lines=($("#t_subs").value||"").split("\n").map(l=>l.trim()).filter(Boolean);
  c.subtasks=lines.length?lines.map(l=>{ const m=l.match(/^(.*?)\s*\|\s*(\d+)\s*$/);
    return m?{n:m[1].trim(),cadDays:+m[2]}:{n:l}; }):undefined;
  if(isNew) D.registry.push(c);
  const dk=todayKey(state.now);
  D.instances=D.instances.filter(i=>!(i.cid===c.id&&i.date===dk&&i.state!=="verified"));
  generateDay(D,state.now);
  state.confirmDel=null; save(); state.page="task:"+c.id; render(); toast("Saved");
};
window.delTask=(id)=>{
  if(state.confirmDel!==id){ state.confirmDel=id; render(); return; }
  const D=state.data;
  D.registry=D.registry.filter(x=>x.id!==id);
  D.instances=D.instances.filter(i=>i.cid!==id);
  for(const r of D.routines){ if(r.memberRefs) r.memberRefs=r.memberRefs.filter(x=>x!==id); }
  state.confirmDel=null; save(); state.page=null; state.view="settings"; render(); toast("Task deleted");
};

window.saveRoutine=(id)=>{
  const D=state.data, isNew=id==="new";
  const name=$("#f_name").value.trim();
  const days=[...document.querySelectorAll(".f_day:checked")].map(x=>+x.value);
  const people=[...document.querySelectorAll(".f_person:checked")].map(x=>x.value);
  if(!name){ toast("Give it a name"); return; }
  if(!days.length){ toast("Pick at least one day"); return; }
  if(!people.length){ toast("Pick at least one person"); return; }
  const orig = isNew ? {} : D.routines.find(x=>x.id===id);
  const r = isNew ? {id:uid("r_")} : orig;
  r.name=name; r.icon=$("#f_icon").value.trim(); r.daypart=$("#f_daypart").value;
  r.days=days; r.people=people; r.tracking=$("#f_tracking").value;
  r.sequenceMode=$("#f_seq").value==="ordered"?"ordered":undefined;
  r.starMode=$("#f_starmode").value; r.stars=Math.max(0, parseInt($("#f_stars").value)||0);
  r.intention=$("#f_intent").value.trim();
  if(!r.memberRefs){
    const oldMembers=orig.members||[];
    r.members=($("#f_members")?.value||"").split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
      const parts=line.split("@"); const n=parts[0].trim();
      const appliesTo=parts.slice(1).map(t=>personByName(t.trim())).filter(Boolean).map(p=>p.id);
      const old=oldMembers.find(m=>m.n===n);
      const m={n}; if(appliesTo.length) m.appliesTo=appliesTo; if(old?.medication) m.medication=true;
      return m; });
    if(r.tracking==="interactive" && !r.members.length){ toast("Interactive routines need at least one step"); return; }
  }
  if(isNew) D.routines.push(r);
  // regenerate today's occurrences so edited steps/people take effect immediately
  const dk=todayKey(state.now);
  D.instances=D.instances.filter(i=>!(i.rid===r.id && i.date===dk && i.state!=="verified"));
  generateDay(D, state.now);
  state.confirmDel=null; save(); state.page=r.id; render(); toast("Saved");
};

function routineLog(r){
  const D=state.data;
  let rows=[];
  if(r.members){ // per-person occurrences
    rows = D.instances.filter(i=>i.rid===r.id)
      .map(i=>({date:i.date, who:nameOf(i.pid), state:i.state==="verified"?"completed":i.state}));
  } else if(r.memberRefs){ // derive occurrence status from member instances by date
    const byDate={};
    for(const i of D.instances){ if(!r.memberRefs.includes(i.cid)) continue;
      (byDate[i.date]=byDate[i.date]||[]).push(i); }
    rows = Object.entries(byDate).map(([date,list])=>{
      const done=list.filter(i=>i.state==="done"||i.state==="verified").length;
      const skipped=list.some(i=>i.state==="skipped");
      const st = done===list.length?"completed" : done>0?`partial (${done}/${list.length})` : skipped?"skipped":"missed";
      return {date, who:r.people.map(nameOf).join(" · "), state:st};
    });
  }
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length) return `<div class="empty">No history yet — it starts logging from today.</div>`;
  const icon=s=>s==="completed"?"✅":s.startsWith("partial")?"◐":s==="skipped"?"⏭":s==="missed"?"✗":"·";
  return rows.slice(0,30).map(x=>`<div class="logrow"><span>${new Date(x.date+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span><span>${x.who}</span><span class="lst">${icon(x.state)} ${x.state}</span></div>`).join("");
}

  const pool=(c.assignees?.length?c.assignees:[]).map(nameOf).join(", ")||"any kid";

    : c.policy==="rotate" ? `rotates: ${pool.replace(/, /g," ↔ ")}`
    : pool;
  const meta=[c.estMin?`${c.estMin} min`:"",c.waitMin?`+ ${c.waitMin} wait`:"",c.timerMin?`⏱ ${c.timerMin} min timer`:"",

function renderKids(dk){

function renderKidCol(kid,dk){
  const D=state.data, nowDp=daypartNow();
  const todays=D.routines.filter(r=>r.people.includes(kid.id)&&r.members&&r.tracking==="interactive"&&r.days.includes(dow(state.now)));
  const info=todays.map(r=>{
    const inst=D.instances.find(i=>i.rid===r.id&&i.pid===kid.id&&i.date===dk);
    const dp=r.daypart||"anytime";
    return {r,inst,dp,done:inst?.state==="verified",
      now: dp==="anytime"||(DP_ORDER[dp]??9)<=DP_ORDER[nowDp],
      overdue: (DP_ORDER[dp]??9)<DP_ORDER[nowDp]};
  }).filter(x=>x.inst);
  const insts=D.instances.filter(i=>{
    if(i.date!==dk||!i.cid) return false;
    const c=D.registry.find(x=>x.id===i.cid);
    return c && involvesKid(D,c) && (i.pid===kid.id ||
      (i.pid==="__open__" && c.policy==="open" && (!c.assignees?.length||c.assignees.includes(kid.id))));
  }).map(i=>({i, c:D.registry.find(x=>x.id===i.cid)}));
  const elig=(c)=>!c.assignees?.length||c.assignees.includes(kid.id);
  const quotas=D.registry.filter(c=>involvesKid(D,c)&&c.schedule?.type==="quota"&&elig(c));
  // --- TODAY card: must-dos by daypart (routines + expected chores); current daypart expanded, earlier-and-open expanded as catch-up, later collapsed ---
  const mineOrFree=x=>x.i.pid!=="__open__"||!x.i.claimedBy||x.i.claimedBy===kid.id; // an open task another kid already claimed is not this kid's
  const jobsAll=insts.filter(mineOrFree);
  const must=jobsAll.filter(x=>isExpected(x.c)), extra=jobsAll.filter(x=>!isExpected(x.c));
  const quotaExtra=quotas; // quota tasks are never must-dos
  const jobDone=x=>x.i.state==="verified", jobWait=x=>x.i.state==="done";
  const dpOf=c=>DP_KEYS.includes(c.daypart)?c.daypart:"evening"; // a must-do without a block (legacy data) lands in the evening until edited
  const cards=DP_KEYS.map(dp=>{
    const rs=info.filter(x=>x.dp===dp), js=must.filter(x=>dpOf(x.c)===dp);
    const openLeft=rs.some(x=>!x.done)||js.some(x=>!jobDone(x));
    const isNow=dp===nowDp, isPast=(DP_ORDER[dp]??9)<DP_ORDER[nowDp];
    const empty=!rs.length&&!js.length;
    const mode=empty?"none":!openLeft?"done":isNow?"now":isPast?"overdue":"later";
    const rows=rs.map(x=>x.done?renderRoutineRow(x,kid,dk,"done"):mode==="later"?renderRoutineRow(x,kid,dk,"later"):renderRoutineRow(x,kid,dk,mode)).join("")
      + js.map(x=>jobDone(x)?`<button class="krow kdone" onclick="openTask('${x.c.id}')">✓ ${x.c.name}${x.c.stars?` <span class="starpill">⭐${x.c.stars}</span>`:""}<span class="chev">›</span></button>`
                 :mode==="later"?`<button class="rrowk later" onclick="openTask('${x.c.id}')"><span class="rk-ic">🕐</span><span class="rk-nm">${x.c.name}</span><span class="rk-meta">${daypartLabel(dp,kid)}</span><span class="chev">›</span></button>`
                 :renderTile(x.i,kid)).join("");
    const strip=placesStripHTML(kid,dk,dp);
    const clear=mode==="none"&&isNow&&!strip?`<div class="allclear"><span class="rk-ic">✓</span>All caught up</div>`:"";
    return `<div class="card dcard ${mode} ${isNow?"cur":""}"><div class="dband"><span class="dico">${dpIcon(dp)}</span><span class="dname">${dpLabel(dp,kid)}</span><span class="drange">| ${dpRange(dp)}</span></div>${strip}${rows}${clear}</div>`;
  }).join("");
  const allMustDone=info.every(x=>x.done)&&must.every(jobDone);
  const todayHTML=`${cards}
    ${allMustDone&&(info.length||must.length)?`<div class="allnow card">🎉 Everything done today!</div>`:""}`;
  // --- EXTRA STARS card: open, optional chores as an offer; grouped by state, empty groups hidden ---
  const grabs=extra.filter(x=>!["done","verified","missed","skipped"].includes(x.i.state)).map(x=>renderTile(x.i,kid)).join("")
    + quotaExtra.filter(c=>quotaStatus(D,c,state.now).done<c.schedule.count).map(c=>renderQuotaTile(c,kid,dk)).join(""); // quota tasks are offers: "N this week" is a hint, not a debt
  const waiting=extra.filter(jobWait).map(x=>renderTile(x.i,kid)).join("");
  const doneX=extra.filter(jobDone).map(x=>`<button class="krow kdone" onclick="openTask('${x.c.id}')">✓ ${x.c.name}${x.c.stars?` <span class="starpill">⭐${x.c.stars}</span>`:""}<span class="chev">›</span></button>`).join("")
    + quotaExtra.filter(c=>quotaStatus(D,c,state.now).done>=c.schedule.count).map(c=>`<button class="krow kdone" onclick="openTask('${c.id}')">✓ ${c.name} <span class="starpill">⭐${c.stars}</span><span class="rmeta">this week</span><span class="chev">›</span></button>`).join("");
  const group=(label,icon,rows)=>rows?`<div class="jgroup"><div class="dband small"><span class="dico">${icon}</span><span class="dname">${label}</span></div>${rows}</div>`:"";
  const extraHTML=`<div class="card xcard"><header><h3>Extra stars</h3><span class="rmeta" style="margin-left:8px">if you want to, for extra ⭐</span></header>
    ${group("Up for grabs","⭐",grabs)}${group("Waiting for a grown-up","✓?",waiting)}${group("Done today","✓",doneX)}
    ${!grabs&&!waiting&&!doneX?`<div class="empty">Nothing extra right now.</div>`:""}</div>`;
  const kb=balances(D,kid.id), kidTotal=kb.spend+kb.save+kb.share+kb.holding, pendRun=pendingRuns(D,kid.id)[0];
  const starsNow=availableStars(D,kid.id), pendStars=pendingStars(D,kid.id);
  state.lastJar=state.lastJar||{}; const last=state.lastJar[kid.id]||{}; // the jars jump only when their number changes, never on navigation
  const starPop=last.stars!==undefined&&last.stars!==starsNow, moneyPop=last.money!==undefined&&last.money!==kidTotal;
  state.lastJar[kid.id]={stars:starsNow,money:kidTotal};
  const hueOpen=state.hueOpen===kid.id;
  return `<div class="kidcol" style="--hue:${kid.hue??350}">
    <div class="kidhead" style="background:var(--k-main)">
      <h2 style="display:flex;align-items:center;gap:10px">${avatarHTML(kid)}${kid.name}</h2>
      <div class="doors"><button class="jar stardoor" onclick="openRewards('${kid.id}')" aria-label="${starsNow} stars${pendStars?`, ${pendStars} being checked`:""}">⭐ <span class="${starPop?"pop":""}">${starsNow}</span>${pendStars?`<span class="pendchip" title="waiting for a grown-up to check">+${pendStars}</span>`:""}</button>
        <button class="moneydoor" onclick="openMoney('${kid.id}')" aria-label="My money${kb.holding>0?`, ${fmtMoney(kb.holding)} waiting for you`:""}">💰 <span class="${moneyPop?"pop":""}">${fmtMoney(kidTotal)}</span>${kb.holding>0?`<span class="pendchip money" title="waiting for you to pick a jar">+${fmtMoney(kb.holding)}</span>`:""}</button>
        <button class="huedoor ${hueOpen?"on":""}" onclick="toggleHue('${kid.id}')" aria-label="Pick my color" title="Pick my color"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    </div>
    ${hueOpen?`<div class="huerow"><span>My color</span><span class="swatches">${HUE_PRESETS.map(h=>`<button data-hue="${h.h}" class="${kid.hue===h.h?"on":""}" title="${h.n}" style="background:oklch(0.76 0.19 ${h.h})" onclick="setHue('${kid.id}',${h.h})"></button>`).join("")}</span></div>`:""}
    ${pendRun?`<div class="allowbanner"><span>🎉 Allowance day! Your money for ${md(pendRun.date)} is ready.</span><button onclick="openMoney('${kid.id}','run')">Let's go</button></div>`:""}
    ${todayHTML}
    ${extraHTML}
  </div>`;
}
const DP_ICON=new Proxy({},{get:(_,k)=>dpIcon(k)});
function renderRoutineRow(x,kid,dk,mode){ // one row per routine inside the Routines card
  const {r,inst,dp}=x, stars=r.starMode==="whole"&&r.stars?`<span class="starpill">⭐${r.stars}</span>`:"";
  if(mode==="done") return `<button class="rrowk done" onclick="openRoutine('${r.id}')"><span class="rk-ic">✓</span><span class="rk-nm">${r.icon||""} ${r.name}</span><span class="rk-meta">done! ${stars}</span><span class="chev">›</span></button>`;
  if(mode==="later") return `<button class="rrowk later" onclick="openRoutine('${r.id}')"><span class="rk-ic">🕐</span><span class="rk-nm">${r.icon||""} ${r.name}</span><span class="rk-meta">${daypartLabel(dp)}</span><span class="chev">›</span></button>`;
  const members=r.members.filter(m=>!m.appliesTo||m.appliesTo.includes(kid.id));
  const doneN=inst.checks.filter(Boolean).length, allDone=doneN===inst.checks.length;
  const seq=r.sequenceMode==="ordered"&&!allDone, curIdx=seq?inst.checks.findIndex(c=>!c):-1;
  return `<div class="rrowk now ${mode==="overdue"?"overdue":""}">
    <div class="rk-head"><span class="rk-nm big">${r.icon||"▶"} ${r.name}</span>${stars}${mode==="overdue"?`<span class="badge">still open</span>`:""}<span class="rk-count">${doneN} of ${inst.checks.length}</span></div>
    <div class="rk-bar"><i style="width:${Math.round(doneN/inst.checks.length*100)}%"></i></div>
    ${r.intention?`<div class="intent">${r.intention}</div>`:""}
    <ul class="rlist">${members.map((m,i)=>{ const cls=inst.checks[i]?'donei':seq?(i===curIdx?'stepcur':'stepdim'):'';
      return `<li><button class="chk ${cls}" onclick="toggleMember('${r.id}','${kid.id}',${i})"><span class="box" style="${inst.checks[i]?`background:var(--k-main)`:''}">${inst.checks[i]?"✓":""}</span>${m.n}${m.medication?' <span class="badge">no stars · adult checks</span>':""}</button></li>`; }).join("")}</ul>
    ${allDone?`<button class="bigbtn" style="background:var(--k-accent);color:var(--k-ink)" onclick="finishRoutine('${r.id}','${kid.id}')">Finish ${r.name}! ${r.stars?`⭐${r.stars}`:""}</button>`
      :`<button class="bigbtn" style="background:var(--k-soft);color:var(--k-ink)" onclick="finishRoutine('${r.id}','${kid.id}')">I did all of these</button>`}
  </div>`;
}
function renderRoutineCard(r,kid,dk,overdue){
  const inst=state.data.instances.find(i=>i.rid===r.id&&i.pid===kid.id&&i.date===dk);
  if(!inst) return "";
  const members=r.members.filter(m=>!m.appliesTo||m.appliesTo.includes(kid.id));
  const allDone=inst.checks.every(Boolean);
  // ordered mode: first unchecked member is the current step; later steps dim but stay tappable
  const ordered=r.sequenceMode==="ordered"&&inst.state!=="verified"&&!allDone;
  const curIdx=ordered?inst.checks.findIndex(c=>!c):-1;
  return `<div class="card">
    <header><h3>${r.icon||""} ${r.name} ${r.starMode==="whole"&&r.stars?`<span class="starpill">⭐${r.stars}</span>`:""} ${overdue?`<span class="badge">still open</span>`:""}</h3></header>
    ${r.intention?`<div class="intent">${r.intention}</div>`:""}
    <ul class="rlist">${members.map((m,i)=>{
      const cls=inst.checks[i]?'donei':ordered?(i===curIdx?'stepcur':'stepdim'):'';
      return `
      <li><button class="chk ${cls}" onclick="toggleMember('${r.id}','${kid.id}',${i})">
        <span class="box" style="${inst.checks[i]?`background:var(--k-main)`:''}">${inst.checks[i]?"✓":""}</span>
        ${m.n}${m.medication?' <span class="badge">no stars · adult checks</span>':""}
      </button></li>`;}).join("")}
    </ul>
    ${inst.state==="verified"
      ? `<div class="routine-done">🎉 ${r.name} done!</div>`
      : allDone
        ? `<button class="bigbtn" style="background:var(--k-accent);color:var(--k-ink)" onclick="finishRoutine('${r.id}','${kid.id}')">Finish ${r.name}! ${r.stars?`⭐${r.stars}`:""}</button>`
        : `<button class="bigbtn" style="background:var(--k-soft);color:var(--k-ink)" onclick="finishRoutine('${r.id}','${kid.id}')">Mark all done</button>`}
  </div>`;
}
function renderTile(inst,kid){
  const c=state.data.registry.find(x=>x.id===inst.cid);
  const shared=inst.pid==="__open__";
  const mine=inst.pid===kid.id;
  const st=inst.state;
  let btn="";
  if(shared&&st==="open") btn=`<button class="act" onclick="act('${iid(inst)}','claim','${kid.id}')">I'll do it!</button>`;
  else if(!shared&&mine&&st==="open") btn=`<button class="act" onclick="act('${iid(inst)}','claim','${kid.id}')">${c.claimMode==="participatory"?"I'll help ⏱":"Start"}</button>`;
  else if(shared&&st!=="open"&&inst.claimedBy!==kid.id) btn=`<span class="badge">${nameOf(inst.claimedBy)}'s</span>`;
  else if(st==="in_process"&&(mine||inst.claimedBy===kid.id)){
    const gateOK=timerGateOpen(inst,c), needCam=photoRequired(c)&&!inst.photo;
    btn = c.timerGate&&!inst.startedAt
      ? `<button class="act" onclick="act('${iid(inst)}','start','${kid.id}')">Start ⏱</button>`
      : needCam
        ? `<button class="act" style="background:var(--k-accent);color:var(--k-ink);${gateOK?'':'opacity:.4'}" ${gateOK?'':'disabled'} onclick="requestPhoto(${iid(inst)},true,'${kid.id}')">📷 Done!</button>`
        : `<button class="act" style="background:var(--k-accent);color:var(--k-ink);${gateOK?'':'opacity:.4'}" ${gateOK?'':'disabled'} onclick="act('${iid(inst)}','done','${kid.id}')">Done!</button>`;
  }
  else if(st==="done") btn=`<button class="act" disabled style="background:var(--k-soft);color:var(--k-ink)">Waiting ✋</button>`;
  else if(st==="verified") btn=`<button class="act" disabled style="background:var(--k-soft);color:var(--k-ink)">✓ Done ⭐</button>`;
  return `<div class="tile state-${st.replace('_','')} ${shared?'sharedt':''}">
    <div class="info"><div class="nm" onclick="openTask('${c.id}')" style="cursor:pointer">${c.name}</div>
      <div class="meta">${c.stars?`<span class="starpill">⭐${c.stars}</span>`:""}
        ${c.claimMode==="participatory"?`<span class="badge">everyone who helps earns</span>`:""}
        ${c.medication?`<span class="badge">no stars</span>`:""}
        ${photoRequired(c)?`<span class="badge">📷 photo</span>`:""}
        ${inst.photo?`<span class="badge">📷 ✓</span>`:""}
        ${inst.returnedAt&&st==="in_process"?`<span class="badge" style="background:var(--k-soft);color:var(--k-ink)">↩ Try again${inst.returnNote?`: ${inst.returnNote}`:""}</span>`:""}
        ${state.data.settings.photoMode==="optional"&&!photoRequired(c)&&!inst.photo&&st==="in_process"&&(mine||inst.claimedBy===kid.id)?`<button class="badge" style="cursor:pointer" onclick="requestPhoto(${iid(inst)},false)">📷 add photo</button>`:""}</div>
      ${fmtTimer(inst,c)}</div>
    ${btn}</div>`;
}

function renderAdultCatchup(){
  const D=state.data, dkStr=todayKey(state.now), nowDp=daypartNow(), occ=occursOn(D,state.now);

  for(const dp of DP_SECTIONS){
    if(dp==="anytime"||(DP_ORDER[dp]??9)>=DP_ORDER[nowDp]) continue;
    for(const r of occ.routines.filter(r=>(r.daypart||"anytime")===dp)){
      if(r.tracking==="display") continue;
      const open=r.people.filter(pid=>{ const s=routineDayStatus(D,r,pid,dkStr); return s!=="completed"&&s!=="none"; });
      if(!open.length) continue;
      if(r.people.includes("a1")&&r.memberRefs&&open.includes("a1")){ inner+=renderAdultRoutine(r,dkStr); continue; }
      inner+=`<div class="pchip-row"><span class="pchip" onclick="openRoutine('${r.id}')">${r.icon||""} ${r.name}</span>
        ${open.map(pid=>`<span class="pwho">${nameOf(pid)} ${dot(routineDayStatus(D,r,pid,dkStr),false)}</span>`).join("")}</div>`;
    }
    for(const j of occ.jobs.filter(j=>(j.c.daypart||"anytime")===dp)){
      const pids=j.pids[0]==="__open__"?[null]:j.pids;
      const open=pids.filter(pid=>{ const s=jobStatus(D,j.c.id,pid,dkStr); return s!=="completed"; });
      if(!open.length) continue;
      inner+=`<div class="pchip-row"><span class="pchip pjob" onclick="openTask('${j.c.id}')">${j.c.name}</span>
        ${open.map(pid=>`<span class="pwho">${pid?nameOf(pid):"open"} ${dot(jobStatus(D,j.c.id,pid,dkStr),false)}</span>`).join("")}</div>`;
    }
  }
  return inner?`<div class="sect" style="margin-top:14px"><h3 class="catchlabel">Catch up</h3>
    <div class="card dayplanner"><div class="dpsec">${inner}</div></div></div>`:"";
}
function renderAdultNow(){
  const D=state.data, dkStr=todayKey(state.now), nowDp=daypartNow(), occ=occursOn(D,state.now);
  let inner="", any=false, allDone=true;
  for(const dp of [nowDp,"anytime"]){
    for(const r of occ.routines.filter(r=>(r.daypart||"anytime")===dp)){
      any=true;
      if(r.people.includes("a1")&&(r.memberRefs||r.tracking==="display")){
        if(r.tracking!=="display"&&routineDayStatus(D,r,"a1",dkStr)!=="completed") allDone=false;
        inner+=renderAdultRoutine(r,dkStr); continue;
      }
      const sts=r.tracking==="display"?[]:r.people.map(pid=>routineDayStatus(D,r,pid,dkStr));
      if(sts.some(s=>s!=="completed")) allDone=false;
      inner+=`<div class="pchip-row"><span class="pchip" onclick="openRoutine('${r.id}')">${r.icon||""} ${r.name}</span>
        ${r.tracking==="display"?`<span class="badge">display</span>`
          :r.people.map(pid=>`<span class="pwho">${nameOf(pid)} ${dot(routineDayStatus(D,r,pid,dkStr),false)}</span>`).join("")}</div>`;
    }
    for(const j of occ.jobs.filter(j=>(j.c.daypart||"anytime")===dp)){
      any=true;
      const pids=j.pids[0]==="__open__"?[null]:j.pids;
      if(pids.some(pid=>jobStatus(D,j.c.id,pid,dkStr)!=="completed")) allDone=false;
      inner+=`<div class="pchip-row"><span class="pchip pjob" onclick="openTask('${j.c.id}')">${j.c.name}</span>
        ${pids.map(pid=>`<span class="pwho">${pid?nameOf(pid):"open"} ${dot(jobStatus(D,j.c.id,pid,dkStr),false)}</span>`).join("")}</div>`;
    }
    if(dp==="anytime") for(const c of D.registry.filter(c=>c.schedule?.type==="quota")){
      any=true; const q=quotaStatus(D,c,state.now);
      if(q.done<q.need) allDone=false;
      inner+=`<div class="pchip-row"><span class="pchip pjob" onclick="openTask('${c.id}')">${c.name}</span><span class="pwho">${q.done}/${q.need} this week ${q.done>=q.need?dot("completed"):dot("open")}</span></div>`;
    }
  }
  if(!any) inner=`<div class="caughtup" style="color:var(--muted)">Nothing scheduled right now${nextAdultHint(D)}</div>`;
  else if(allDone) inner+=`<div class="caughtup">✓ Caught up for now</div>`;
  return `<div class="sect"><h3>Now · ${DP_SHORT[nowDp]}</h3>
    <div class="card dayplanner"><div class="dpsec dpnow">${inner}</div></div></div>`;
}

/* ---------- planner: day-by-daypart + week grid with projection ---------- */
const DP_SECTIONS=["morning","midday","afternoon","evening","anytime"];
const DP_SHORT=new Proxy({},{get:(_,k)=>dpLabel(k)}); // family labels; kid cards use per-person labels via dpLabel(key, kid)
function occursOn(data,date){ // pure projection: what runs on this date (no instances created)
  const day=dow(date), wk=weekKey(date,data.settings.weekStart);
  const memberOf={}; for(const r of data.routines) for(const cid of (r.memberRefs||[])) memberOf[cid]=r;
  const routines=data.routines.filter(r=>r.days.includes(day));
  const jobs=[];
  for(const c of data.registry){
    if(memberOf[c.id]) continue;
    const oc=c.schedule;
    if(oc?.type==="once"){ if(oc.date!==todayKey(date)) continue; }
    else if(oc?.type!=="fixed" || !oc.days.includes(day)) continue;
    jobs.push({c, pids:assigneesFor(data,c,wk)});
  }
  return {routines, jobs};
}
function routineDayStatus(data,r,pid,dkStr){
  if(r.tracking==="display") return null;
  if(r.members){
    const i=data.instances.find(x=>x.rid===r.id&&x.pid===pid&&x.date===dkStr);
    if(!i) return "none";
    if(i.state==="verified") return "completed";
    if(i.state==="missed") return "missed";
    return i.checks.some(Boolean)?"partial":"open";
  }
  const list=data.instances.filter(i=>r.memberRefs.includes(i.cid)&&i.date===dkStr);
  if(!list.length) return "none";
  const done=list.filter(i=>i.state==="done"||i.state==="verified").length;
  return done===list.length?"completed":done>0?"partial":list.every(i=>i.state==="missed")?"missed":"open";
}
function jobStatus(data,cid,pid,dkStr){
  const i=data.instances.find(x=>x.cid===cid&&(x.pid===pid||pid==null)&&x.date===dkStr);
  if(!i) return "none";
  return i.state==="verified"||i.state==="done"?"completed":i.state==="missed"?"missed":i.state==="in_process"?"partial":"open";
}
function dot(status,future){
  if(future||status==="none") return `<i class="dot d-gray"></i>`;
  const cls=status==="completed"?"d-ok":status==="missed"?"d-miss":status==="partial"?"d-part":"d-gray";
  return `<i class="dot ${cls}"></i>`;
}
function renderPlanner(){
  const D=state.data, cur=state.cursor, mode=state.adultMode;
  const label = mode==="week"

function nextAdultHint(D){
  for(let i=1;i<=7;i++){ const d=new Date(state.now); d.setDate(d.getDate()+i);
    const r=occursOn(D,d).routines.find(r=>r.people.includes("a1")&&r.tracking!=="display");
    if(r) return ` · Next for you: ${r.icon||""} ${r.name} ${d.toLocaleDateString(undefined,{weekday:"long"})}`;
  } return "";
}
function renderDayPlanner(cur){
  const D=state.data, dkStr=todayKey(cur), isToday=dkStr===todayKey(state.now), isFuture=dkStr>todayKey(state.now);
  const occ=occursOn(D,cur), nowDp=daypartNow();
  const secs=DP_SECTIONS.map(dp=>{
    const rs=occ.routines.filter(r=>(r.daypart||"anytime")===dp);
    const js=occ.jobs.filter(j=>(j.c.daypart||"anytime")===dp);
    let inner="";
    for(const r of rs){
      inner+=`<div class="pchip-row"><span class="pchip" onclick="openRoutine('${r.id}')">${r.icon||""} ${r.name}</span>
        ${r.tracking==="display"?`<span class="badge">display</span>`
          :r.people.map(pid=>`<span class="pwho">${nameOf(pid)} ${dot(routineDayStatus(D,r,pid,dkStr),isFuture)}</span>`).join("")}</div>`;
    }
    for(const j of js){
      const pids=j.pids[0]==="__open__"?[null]:j.pids;
      inner+=`<div class="pchip-row"><span class="pchip pjob" onclick="openTask('${j.c.id}')">${j.c.name}</span>
        ${pids.map(pid=>`<span class="pwho">${pid?nameOf(pid):"open"} ${dot(jobStatus(D,j.c.id,pid,dkStr),isFuture)}</span>`).join("")}</div>`;
    }
    if(dp==="anytime" && isToday){ // weekly quotas live here on the live day
      for(const c of D.registry.filter(c=>c.schedule?.type==="quota")){
        const q=quotaStatus(D,c,cur);
        inner+=`<div class="pchip-row"><span class="pchip pjob" onclick="openTask('${c.id}')">${c.name}</span><span class="pwho">${q.done}/${q.need} this week ${q.done>=q.need?dot("completed"):dot("open")}</span></div>`;
      }
    }
    return inner?`<div class="dpsec"><h4>${DP_SHORT[dp]}${isToday&&dp===nowDp?" · now":""}</h4>${inner}</div>`:"";
  }).join("");
  return `<div class="card dayplanner">${secs||`<div class="empty">Nothing scheduled.</div>`}${isFuture?`<div class="empty" style="border-top:1px solid var(--line)">Projected — nothing is generated until the day arrives.</div>`:""}</div>`;
}
function plannerWeekStart(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()-state.data.settings.weekStart+7)%7)); return x; }
function renderWeekPlanner(cur){
  const D=state.data, start=plannerWeekStart(cur), today=todayKey(state.now);
  let cols="";
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const dkStr=todayKey(d), isFuture=dkStr>today, isToday=dkStr===today;
    const occ=occursOn(D,d);
    let cell="";
    for(const dp of DP_SECTIONS){
      const rs=occ.routines.filter(r=>(r.daypart||"anytime")===dp);
      const js=occ.jobs.filter(j=>(j.c.daypart||"anytime")===dp);
      if(!rs.length&&!js.length) continue;
      cell+=`<div class="wdp">${DP_SHORT[dp]}</div>`;
      for(const r of rs){
        const sts=r.tracking==="display"?"":r.people.map(pid=>dot(routineDayStatus(D,r,pid,dkStr),isFuture)).join("");
        cell+=`<div class="wchip">${r.icon||""} ${r.name} ${sts}</div>`;
      }
      for(const j of js){
        const pids=j.pids[0]==="__open__"?[null]:j.pids;
        cell+=`<div class="wchip wjob">${j.c.name} ${pids.map(pid=>dot(jobStatus(D,j.c.id,pid,dkStr),isFuture)).join("")}</div>`;
      }
    }
    cols+=`<div class="wcol ${isToday?'wtoday':''}">
      <button class="whead" onclick="gotoDay('${dkStr}')">${d.toLocaleDateString(undefined,{weekday:"short"})}<br><span>${d.getDate()}</span></button>
      ${cell||`<div class="wchip" style="opacity:.4">—</div>`}</div>`;
  }
  return `<div class="card weekgrid">${cols}</div>`;
}

window.requestPhoto=(idx, thenDone, actor)=>{
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>{ // downscale to ~640px JPEG so persistence stays under the storage cap
      const scale=Math.min(1, 640/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.width*scale)); cv.height=Math.max(1,Math.round(img.height*scale));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      const inst=state.data.instances[idx]; if(!inst) return;
      inst.photo=cv.toDataURL("image/jpeg",0.7);
      if(thenDone) transition(state.data,inst,"done",actor);
      save(); render(); if(!thenDone) toast("📷 Photo added");
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); toast("Couldn't read that photo"); };
    img.src=url; };
  inp.click();
};

function chartHTML(kid){
  const pts=history(state.data,kid.id); if(pts.length<2) return "";
  const W=800,H=240,L=54,R=12,T=14,B=34;
  const max=Math.max(10,...pts.flatMap(p=>[p.spend,p.save,p.share]))*1.08;
  const x=i=>L+i*(W-L-R)/(pts.length-1), y=v=>T+(H-T-B)*(1-v/max);
  const line=(k,col)=>`<polyline fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>x(i)+","+y(p[k])).join(" ")}"/>`;
  const ticks=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--k-jar)" stroke-width="2"/><text x="${L-8}" y="${y(max*f)+6}" text-anchor="end" font-size="15" fill="var(--k-muted)">$${Math.round(max*f)}</text>`).join("");
  const xl=pts.map((p,i)=>i%2===0||i===pts.length-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="15" fill="var(--k-muted)">${p.label}</text>`:"").join("");
  return `<div class="chart"><h2>How my money has changed</h2><svg viewBox="0 0 ${W} ${H}" font-family="inherit">${ticks}${xl}${line("spend","var(--k-spend)")}${line("share","var(--k-share)")}${line("save","var(--k-save)")}</svg></div>`;
}

window.amImportRows=()=>{ // one-time ledger import (allowance-import.json from the Numbers export); idempotent per import tag and kid
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ let j; try{ j=JSON.parse(rd.result); }catch(x){ toast("Not a JSON file"); return; }
      const rows=j.rows||[], tag=j.import||"import"; const D=state.data; ensureMoney(D); let added=0, skipped=0;
      for(const r of rows){
        if(!D.people.some(p=>p.id===r.kid)){ skipped++; continue; }
        if(D.money.some(x=>x.importTag===tag&&x.kid===r.kid&&x.iseq===r.iseq)){ skipped++; continue; }
        addRow(D,{kid:r.kid,date:r.date,acct:r.acct,amt:r.amt,type:r.type,note:r.note||"",origin:r.origin||"user",rate:r.rate,base:r.base,linkId:r.linkId,importTag:tag,iseq:r.iseq}); added++; }
      generateRuns(D,state.now); for(const k of D.people.filter(p=>p.role==="child")) checkGoals(D,k.id);
      save(); render(); toast(`Imported ${added} rows${skipped?`, skipped ${skipped}`:""}`); };
    rd.readAsText(f); };

  return `<div class="kidcol" style="--hue:${kid.hue??350}"><div class="mp rp">

/* =========================================================================
   CLOUD — Supabase persistence (board v0.24). The in-memory model is unchanged;
   this layer mirrors each collection to a table (one row per document, `doc`
   jsonb), pushes diffs after every save(), and applies other devices' changes
   live. localStorage stays as the offline cache. Cloud wins on boot.
   ========================================================================= */
const SUPA={ url:"https://uezrisrlatltsonafaoh.supabase.co", key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlenJpc3JsYXRsdHNvbmFmYW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTM0NjYsImV4cCI6MjEwNDQ2OTQ2Nn0.OSN92ndpq6feSiV-uD74dAvYGNYLVHa3Vrknml7ssO4" /* anon key: public by design; RLS is the security */ };
const CLOUD_TABLES={ people:"people", registry:"contributions", routines:"routines", instances:"instances", money:"money_transactions",
  runs:"allowance_runs", goals:"goals", rewards:"rewards", redemptions:"redemptions", starLedger:"star_ledger", moneyClaims:"money_claims" };
const STATE_KEYS=["settings","subMemory","log","version"];
const cloud={ sb:null, fid:null, user:null, synced:{}, stateSynced:"", ready:false, pushing:false, again:false, status:"off", channel:null };
const uid=(p="")=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); // device-unique ids: several devices write at once

function cloudAvailable(){ return typeof window.supabase?.createClient==="function"; }
async function cloudInit(){
  if(!cloudAvailable()){ cloud.status="nolib"; return false; }
  cloud.sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await cloud.sb.auth.getSession();
  if(!session){ cloud.status="signedout"; return false; }
  cloud.user=session.user;
  return cloudAttach();
}
async function cloudAttach(){
  try{
    let {data:fid,error}=await cloud.sb.rpc("my_family"); if(error) throw error;
    if(!fid){ const r=await cloud.sb.rpc("create_family",{p_name:"Our family"}); if(r.error) throw r.error; fid=r.data; }
    cloud.fid=fid;
    const pulled=await cloudPull();
    if(!pulled){ await cloudPushAll(); } // first device: the local board becomes the family's board
    cloudSubscribe(); cloud.ready=true; cloud.status="on"; return true;
  }catch(e){ console.error("cloud attach failed",e); cloud.status="error:"+(e.message||e); return false; }
}
async function cloudSignIn(email,password){
  const {data,error}=await cloud.sb.auth.signInWithPassword({email,password});
  if(error) return error.message;
  cloud.user=data.user; const ok=await cloudAttach(); return ok?null:(cloud.status);
}
async function cloudSignOut(){ try{ await cloud.sb.auth.signOut(); }catch(e){} cloud.user=null; cloud.fid=null; cloud.ready=false; cloud.status="signedout"; if(cloud.channel){ cloud.sb.removeChannel(cloud.channel); cloud.channel=null; } }

async function cloudPull(){ // returns false when the family has no board yet
  const sb=cloud.sb, fid=cloud.fid;
  const st=await sb.from("board_state").select("doc").eq("family_id",fid).maybeSingle(); if(st.error) throw st.error;
  if(!st.data) return false;
  const fresh=DEFAULT_DATA(); const local=state.data||{};
  const next={...fresh, ...st.data.doc, seq: local.seq||fresh.seq};
  cloud.stateSynced=JSON.stringify(pickState(st.data.doc));
  for(const [key,table] of Object.entries(CLOUD_TABLES)){
    const rows=await fetchAll(table,fid); next[key]=rows.map(r=>r.doc);
    cloud.synced[key]=Object.fromEntries(rows.map(r=>[r.id,JSON.stringify(r.doc)]));
  }
  state.data=next; migrate(state.data); return true;
}
async function fetchAll(table,fid){ // page through; instances and money grow
  const out=[]; let from=0; const page=1000;
  for(;;){ const {data,error}=await cloud.sb.from(table).select("id,doc").eq("family_id",fid).range(from,from+page-1); if(error) throw error;
    out.push(...data); if(data.length<page) break; from+=page; }
  return out;
}
function pickState(d){ const o={}; for(const k of STATE_KEYS) if(d[k]!==undefined) o[k]=d[k]; return o; }
function docId(key,d){ return d.id; }
async function cloudPushAll(){ for(const key of Object.keys(CLOUD_TABLES)) cloud.synced[key]={}; cloud.stateSynced=""; await cloudPush(true); }
async function cloudPush(force){ // diff every collection against what this device last saw in the cloud
  if(!cloud.ready&&!force) return; if(cloud.pushing){ cloud.again=true; return; }
  cloud.pushing=true;
  try{
    const sb=cloud.sb, fid=cloud.fid, D=state.data;
    for(const [key,table] of Object.entries(CLOUD_TABLES)){
      const cur=D[key]||[], seen=cloud.synced[key]||(cloud.synced[key]={}), ups=[], ids=new Set();
      for(const d of cur){ if(!d.id) d.id=uid(key[0]); ids.add(d.id); const j=JSON.stringify(d); if(seen[d.id]!==j){ ups.push({id:d.id,family_id:fid,doc:d}); seen[d.id]=j; } }
      const dels=Object.keys(seen).filter(id=>!ids.has(id));
      for(let i=0;i<ups.length;i+=200){ const {error}=await sb.from(table).upsert(ups.slice(i,i+200),{onConflict:"id"}); if(error){ for(const u of ups.slice(i,i+200)) delete seen[u.id]; throw error; } }
      if(dels.length){ const {error}=await sb.from(table).delete().in("id",dels); if(error) throw error; for(const id of dels) delete seen[id]; }
    }
    const st=pickState(D), sj=JSON.stringify(st);
    if(sj!==cloud.stateSynced){ const {error}=await sb.from("board_state").upsert({family_id:fid,doc:st},{onConflict:"family_id"}); if(error) throw error; cloud.stateSynced=sj; }
    cloud.status="on";
  }catch(e){ console.error("cloud push failed",e); cloud.status="error:"+(e.message||e); toast("Cloud save failed — kept locally, will retry"); }
  finally{ cloud.pushing=false; if(cloud.again){ cloud.again=false; cloudPush(); } }
}
function cloudSubscribe(){
  const sb=cloud.sb, fid=cloud.fid;
  if(cloud.channel) sb.removeChannel(cloud.channel);
  const ch=sb.channel("family-"+fid);
  for(const [key,table] of Object.entries(CLOUD_TABLES)){
    ch.on("postgres_changes",{event:"*",schema:"public",table,filter:`family_id=eq.${fid}`},payload=>applyRemote(key,payload));
  }
  ch.on("postgres_changes",{event:"*",schema:"public",table:"board_state",filter:`family_id=eq.${fid}`},payload=>{
    const doc=payload.new?.doc; if(!doc) return; const j=JSON.stringify(pickState(doc)); if(j===cloud.stateSynced) return;
    Object.assign(state.data,pickState(doc)); cloud.stateSynced=j; remoteRender(); });
  ch.subscribe(status=>{ cloud.live=status==="SUBSCRIBED"; });
  cloud.channel=ch;
}
function applyRemote(key,payload){
  const D=state.data, seen=cloud.synced[key]||(cloud.synced[key]={});
  if(payload.eventType==="DELETE"){ const id=payload.old?.id; if(!id||!seen[id]) return; delete seen[id]; D[key]=(D[key]||[]).filter(d=>d.id!==id); remoteRender(); return; }
  const doc=payload.new?.doc; if(!doc) return; const j=JSON.stringify(doc); if(seen[doc.id]===j) return; // our own write echoed back
  seen[doc.id]=j; const arr=D[key]||(D[key]=[]); const i=arr.findIndex(d=>d.id===doc.id); if(i>=0) arr[i]=doc; else arr.push(doc);
  remoteRender();
}
let remoteTimer=null;
function remoteRender(){ clearTimeout(remoteTimer); remoteTimer=setTimeout(()=>{ const ae=document.activeElement; if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")) { remoteRender(); return; } try{ localStorage.setItem(KEY,JSON.stringify(state.data)); }catch(e){} render(); },250); }

/* ---- sign-in overlay ---- */

    <input type="email" id="si-email" placeholder="email" autocomplete="username" style="width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit">

window.doSignIn=async()=>{ const b=$(".signin .act"); if(b){ b.disabled=true; b.textContent="Signing in…"; }
  const err=await cloudSignIn($("#si-email").value.trim(),$("#si-pass").value);

window.workOffline=()=>{ cloud.status="offline"; render(); };
window.cloudSignOutClick=async()=>{ await cloudSignOut(); render(); };
function cloudStatusLine(){
  const s=cloud.status;
  if(s==="on") return `<span class="rmeta">☁️ Synced${cloud.live?" · live":""} · ${cloud.user?.email||""}</span> <button class="newbtn" onclick="cloudSignOutClick()">Sign out</button>`;
  if(s==="offline"||s==="signedout") return `<span class="rmeta">☁️ Not signed in · this device only</span> <button class="newbtn" onclick="cloud.status='signedout';render()">Sign in</button>`;
  if(s==="nolib") return `<span class="rmeta">☁️ Cloud library didn't load (offline?) · this device only</span>`;
  if(String(s).startsWith("error")) return `<span class="rmeta">☁️ Cloud error: ${String(s).slice(6)}</span> <button class="newbtn" onclick="cloudAttach().then(render)">Retry</button>`;
  return `<span class="rmeta">☁️ Connecting…</span>`;
}

/* ---------- boot ---------- */
(async function(){
  await loadData();
  migrate(state.data);
  render(); // local cache first, so the board is usable immediately
  const ok=await cloudInit(); // then the family's cloud board (wins over the cache)
  if(!ok&&cloud.status==="signedout"){ $("#app").innerHTML=renderSignIn(); return; }
  generateDay(state.data, state.now);
  generateRuns(state.data, state.now);
  save(); render();
  loadLunch().then(render);
  let shownDay=todayKey(state.now);
  const refreshNow=()=>{ state.now=new Date(); const dk=todayKey(state.now); if(dk===shownDay) return false;
    shownDay=dk; if(!state.data) return false; // new calendar day: close out yesterday, create today's occurrences, redraw
    if(todayKey(state.cursor)<dk) state.cursor=new Date(state.now);
    generateDay(state.data,state.now); generateRuns(state.data,state.now); save(); render(); loadLunch().then(render); return true; };
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshNow(); });
  window.addEventListener("pageshow",refreshNow);
  setInterval(()=>{ // live timers — but never clobber text being typed
    if(refreshNow()) return;
    const ae=document.activeElement;
    if(ae && (ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")) return;
    if(document.querySelector(".timer:not(.paused)")) render();
  }, 1000);
})();
</script>
