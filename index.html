<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Contributions Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F0F2EC; --card:#FFFFFF; --ink:#26332B; --muted:#6C7A6F; --line:#DCE2D8;
  --star:#F5B301; --star-soft:#FBEECF;      /* system color: stars, fixed on every screen */
  --money:#2E9E4F; --money-soft:#E3F3E7;    /* system color: money, fixed on every screen */
  --adult:#4A6455; --ok:#4E8F5B; --pending:#C08A3E; --pending-soft:#F6EBD9;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Fredoka","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:500}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--adult);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:1.15rem}
.topbar .date{color:var(--muted);font-size:.85rem}
.toggle{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.toggle button{padding:7px 16px;border-radius:999px;font-size:.9rem;color:var(--muted)}
.toggle button.on{background:var(--adult);color:#fff}
main{max-width:1080px;margin:0 auto;padding:16px}

/* ---------- kid view ---------- */
.kidgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.kidgrid{grid-template-columns:1fr}}
.kidcol{display:flex;flex-direction:column;gap:12px}
/* theme layer: one hue per kid (people.hue), every kid-screen color derived by lightness in oklch */
.kidcol{--k-main:oklch(0.67 0.22 var(--hue));--k-accent:oklch(0.78 0.19 var(--hue));--k-soft:oklch(0.93 0.07 var(--hue));--k-jar:oklch(0.955 0.04 var(--hue));--k-ink:oklch(0.26 0.06 var(--hue))}
.kidcol .tile.state-verified .act,.kidcol .tile.state-done .act{background:var(--k-soft);color:var(--k-ink)}
.kidcol .card{border-color:var(--k-soft)}
.kidcol .card>header{background:var(--k-jar);border-bottom-color:var(--k-soft)}
.kidcol .card>header h3{color:var(--k-ink)}
.kidcol .intent{color:var(--k-muted)}
.kidcol .rlist li,.kidcol .tile,.kidcol .krow{border-bottom-color:var(--k-jar)}
.kidcol .chk .box{border-color:var(--k-lock)}
.kidcol .chk.stepcur{background:var(--k-soft)}
.kidcol .chk.stepcur .box{border-color:var(--k-main)}
.kidcol .routine-done{background:var(--k-soft);color:var(--k-ink)}
.kidcol .nowlabel,.kidcol .kdp h4{color:var(--k-main)}
.kidcol .kdp h4{border-top-color:var(--k-jar)}
.kidcol .nextup{background:var(--k-soft);border-color:var(--k-accent);color:var(--k-ink)}
.kidcol .nextup span{color:var(--k-muted)}
.kidcol .tile .act{background:var(--k-main);color:#fff}
.kidcol .tile.state-in .act{background:var(--k-main)}
.kidcol .tile .tbar>i{background:var(--k-main)}
.kidcol .krow .chev{color:var(--k-main)}
.kidcol .krow.kdone{color:var(--k-muted)}
.kidcol .badge{background:var(--k-jar);color:var(--k-ink)}
.kidcol .allowbanner{background:var(--money-soft)}
.rcard>header .dpnow{font-family:"Fredoka";font-size:1.15rem;color:var(--k-main);font-weight:600}
.rrowk{border-bottom:1px solid var(--k-jar)}
.rrowk:last-child{border-bottom:none}
button.rrowk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 14px;font-size:1.05rem}
.rrowk .rk-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:1.1rem}
.rrowk.done .rk-ic{background:var(--k-main);color:#fff;font-weight:700}
.rrowk.done .rk-nm{text-decoration:line-through;color:var(--k-muted)}
.rrowk.later{opacity:.6}
.rrowk.later .rk-ic{background:var(--k-jar)}
.rrowk .rk-nm{flex:1}
.rrowk .rk-meta{font-size:.85rem;color:var(--k-muted);display:flex;gap:6px;align-items:center}
.rrowk.now{border-left:10px solid var(--k-main);background:#fff}
.rrowk.now.overdue{border-left-color:var(--pending)}
.rrowk .rk-head{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;flex-wrap:wrap}
.rrowk .rk-head .rk-ic{background:var(--k-soft)}
.rrowk .rk-nm.big{font-family:"Fredoka";font-size:1.3rem}
.rrowk .rk-count{margin-left:auto;font-family:"Fredoka";color:var(--k-main);font-size:1rem}
.rk-bar{height:8px;background:var(--k-jar);margin:0 14px 6px;border-radius:999px;overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--k-accent);border-radius:999px;transition:width .4s}
.allclear{display:flex;align-items:center;gap:10px;padding:14px;font-size:1.05rem;color:var(--k-muted);background:#fff}
.allclear .rk-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--k-jar);color:var(--k-main);font-weight:700}
.allnow{padding:12px 14px;font-family:"Fredoka";color:var(--k-main);text-align:center}
.todayhead{display:flex;align-items:center;justify-content:space-between;font-family:"Fredoka";font-size:1.35rem;color:var(--k-ink);padding:4px 4px 0}
.todayhead{justify-content:flex-start;gap:8px}
.todayhead .tdate{font-size:1.05rem;color:var(--k-muted);font-weight:400}
.dband .drange{font-family:"Fredoka";font-size:.95rem;color:var(--k-muted);margin-left:2px}
.dband .dcheck{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--k-main);color:#fff;display:grid;place-items:center;font-size:.85rem}
.dcard.later .dband .drange,.dcard.done .dband .drange,.dcard.none:not(.cur) .dband .drange{font-size:.8rem}
.dayarc{width:100%;max-width:560px;display:block;margin:0 auto 8px;height:auto}
.dcard{position:relative}
.dcard.cur,.dcard.overdue{padding-left:10px}
.dcard.cur::before,.dcard.overdue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--pending);z-index:1} /* straight bar, clipped by the card's corners */
.dcard.cur::before{background:var(--k-ink)} /* dark bar on the current time block, done or not */
.dcard.later,.dcard.none{opacity:.65}
.dcard.cur{opacity:1}
.dcard .rrowk.now{border-left:none}
.dcard.later .dband,.dcard.done .dband,.dcard.none:not(.cur) .dband{padding:4px 14px}
.dcard.later .dband .dico,.dcard.done .dband .dico,.dcard.none:not(.cur) .dband .dico{font-size:1rem}
.dcard.later .dband .dname,.dcard.done .dband .dname,.dcard.none:not(.cur) .dband .dname{font-size:1rem}
.dcard.now .dband{background:var(--k-soft)}
.dcard .dband{border-top:none}
.dsec{border-left:10px solid transparent}
.dsec.now{border-left-color:var(--k-main)}
.dsec.overdue{border-left-color:var(--pending)}
.dsec.later{opacity:.6}
.dsec .rrowk.now{border-left:none}
.dband{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--k-jar);font-family:"Fredoka";border-top:1px solid var(--k-soft)}
.dsec:first-child .dband{border-top:none}
.dband .dico{font-size:1.3rem}
.dband .dname{font-size:1.2rem;font-weight:600;color:var(--k-ink)}
.dband .dstate{margin-left:auto;font-size:.9rem;color:var(--k-main);background:#fff;border-radius:999px;padding:2px 10px}
.dsec.now .dband{background:var(--k-soft)}
.dsec.later .dband,.dsec.done .dband{padding:4px 14px}
.dsec.later .dband .dico,.dsec.done .dband .dico{font-size:1rem}
.dsec.later .dband .dname,.dsec.done .dband .dname{font-size:1rem}
.dsec.later .dband .dstate,.dsec.done .dband .dstate{font-size:.75rem;padding:1px 8px}
.kidcol .tcard>header,.kidcol .xcard>header{background:var(--k-main);border-bottom:none;padding:12px 14px}
.kidcol .tcard>header h3,.kidcol .xcard>header h3{color:#fff;font-size:1.35rem}
.kidcol .tcard>header .dpnow{color:#fff;background:rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:1rem}
.kidcol .xcard>header .rmeta{color:rgba(255,255,255,.85)}
.dsec.done .dband .dstate{background:var(--k-main);color:#fff}
.dband.small{padding:4px 14px}
.dband.small .dico{font-size:1rem}
.dband.small .dname{font-size:1rem}
.xcard .tile .starpill{font-size:.95rem;padding:2px 10px}
.kidcol .tile.state-done .tbar>i{background:var(--k-main)}
.kidcol .timer.up{color:var(--k-main)}
.kidcol .caughtup{color:var(--k-main)}
.swatches{display:flex;gap:6px}
.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--ink)}
.school{padding:8px 14px 10px;background:#fff;border-bottom:1px solid var(--k-jar);display:flex;flex-direction:column;gap:6px;font-size:.95rem;color:var(--k-ink)}
.school .sl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;line-height:1.35}
.school .sl .ic{flex:none}
.school .sl .txt{flex:1;min-width:0}
.school .muted{color:var(--k-muted)}
.school .seg{display:inline-flex;border:1.5px solid var(--k-soft);border-radius:999px;overflow:hidden}
.school .seg button{padding:4px 12px;font-size:.85rem;font-family:"Fredoka";color:var(--k-muted);background:#fff}
.school .seg button.on{background:var(--k-accent);color:var(--k-ink);font-weight:600}
.dcard.later .school,.dcard.done .school,.dcard.none .school{opacity:1}
.sprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sprow input[type=text]{width:90px}
.sprow .days{display:inline-flex;gap:3px}
.sprow .days button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:.75rem;color:var(--muted)}
.sprow .days button.on{background:var(--adult);border-color:var(--adult);color:#fff}
.sprow .rmeta{font-size:.78rem;flex:none}
.sprow label.rmeta{display:inline-flex;align-items:center;gap:4px}
.sprow .who{display:inline-block;width:60px;flex:none}
.sprow .days button.every{background:var(--adult);border-color:var(--adult);color:#fff}
.sprow .days button.alt{background:#fff;border:1.5px dashed var(--adult);color:var(--adult);font-weight:700;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sprow .days button.alt small{font-size:.5rem;font-weight:400;letter-spacing:.03em}
.sprow .days button{width:32px;height:30px}
.newbtn.del{border-color:#b3543f;color:#b3543f;padding:4px 10px}
.hours{display:flex;gap:8px;flex-wrap:wrap}
.hours label{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:2px}
.hours input[type=time]{font-size:.8rem;padding:2px 4px}
.grp{margin:6px 10px 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafbf9}
.grp.past{background:#f3f4f1}
.sprow .grow{flex:1;min-width:140px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:#fff;color:var(--ink)}
.chip i{color:var(--muted);font-style:normal}
.chip a{color:var(--adult);text-decoration:none;margin-left:4px}
a.chip{color:var(--adult)}
.settings .row>.sprow{flex:1}
.kidcfg{flex-basis:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.kidcfg .wk{display:flex;gap:6px}
.kidcfg label{display:flex;flex-direction:column;align-items:center;gap:2px}
.kidcfg label small{font-size:.65rem;color:var(--muted)}
.settings .kidcfg input[type=text]{width:52px;text-align:right;padding:4px 6px}
.settings .kidcfg .cap input[type=text]{width:40px}
.kidbadge{font-size:.7rem;border-radius:999px;padding:1px 7px;background:var(--pending-soft);color:#7a5716;margin-left:6px}
.kidhead{border-radius:var(--r);padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.kidhead h2{font-size:1.4rem}
.jar{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px;font-family:"Fredoka";font-size:1.2rem}
.jar .pop{display:inline-block;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.card>header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:1.05rem;display:flex;gap:8px;align-items:center}
.intent{font-size:.78rem;color:var(--muted);padding:0 14px 8px}
.rlist{list-style:none}
.rlist li{border-bottom:1px solid var(--line)}
.rlist li:last-child{border-bottom:none}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;font-size:1.02rem}
.chk .box{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:1rem;color:#fff;transition:background .15s}
.chk.donei .box{border-color:transparent}
.chk.donei{color:var(--muted);text-decoration:line-through}
.chk.stepcur{background:var(--star-soft)}
.chk.stepcur .box{border-color:var(--star)}
.chk.stepdim{opacity:.45}
.routine-done{background:var(--star-soft);padding:10px 14px;font-family:"Fredoka";display:flex;gap:8px;align-items:center}
.bigbtn{width:100%;padding:12px;font-family:"Fredoka";font-size:1rem;border-radius:0;color:#fff}
/* chore tiles */
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tile:last-child{border-bottom:none}
.tile .info{flex:1;min-width:0}
.tile .nm{font-size:1rem}
.tile .meta{font-size:.75rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.starpill{background:var(--star-soft);color:#8a6414;border-radius:999px;padding:1px 8px;font-family:"Fredoka";font-size:.75rem}
.state-open .act{background:var(--adult)}
.tile .act{color:#fff;border-radius:10px;padding:10px 14px;font-family:"Fredoka";font-size:.9rem;flex:none;min-width:86px}
.tile.state-in .act{background:var(--pending)}
.tile.state-done .act,.tile.state-verified .act{background:var(--ok)}
.tile.state-done .act:disabled,.tile.state-verified .act:disabled{cursor:default}
.timer{font-variant-numeric:tabular-nums;font-family:"Fredoka";color:var(--pending)}
.timer.up{color:var(--ok)}
.timer.paused{opacity:.55}
.pausebtn{margin-left:8px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font-size:.8rem;vertical-align:middle;background:var(--card)}
.tbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.tbar>i{display:block;height:100%;background:var(--pending);transition:width 1s linear}
.tile.state-done .tbar>i{background:var(--ok)}
.badge{font-size:.7rem;border-radius:999px;padding:1px 7px;background:var(--pending-soft);color:#7a5716}
.shared{border:2px dashed var(--star);}
.shared>header{background:var(--star-soft);border-bottom-color:var(--star)}
.chipdone{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-family:"Fredoka";font-size:.9rem;color:var(--muted);align-self:flex-start}
.nextup{background:var(--star-soft);border:1px solid var(--star);border-radius:var(--r);padding:14px;text-align:center;font-family:"Fredoka";font-size:1.05rem}
.nextup span{font-size:.85rem;color:var(--muted);font-family:"Atkinson Hyperlegible"}
.nextup{width:100%;cursor:pointer}
.chipdone{cursor:pointer}
.backbtn{font-family:"Fredoka";font-size:.95rem;color:var(--adult);padding:4px 0}
.newbtn{font-family:"Fredoka";font-size:.85rem;color:var(--adult);border:1.5px solid var(--adult);border-radius:999px;padding:6px 14px}
.daychecks{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.daychecks label{display:flex;gap:3px;align-items:center;font-size:.8rem}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .rname{font-family:"Fredoka";font-size:1rem;flex:none}
.rrow .rmeta,.rmeta{font-size:.78rem;color:var(--muted);flex:1;min-width:0}
.rrow .chev{color:var(--muted);font-size:1.2rem}
.logrow{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.85rem}
.logrow:last-child{border-bottom:none}
.logrow span:first-child{width:110px;flex:none;color:var(--muted)}
.logrow span:nth-child(2){flex:1;min-width:0}
.logrow .lst{flex:none}
/* planner */
.pnav{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.navarrow{font-size:1.3rem;color:var(--adult);padding:2px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.dayplanner .dpsec{border-bottom:1px solid var(--line);padding:8px 14px}
.dayplanner .dpsec:last-child{border-bottom:none}
.dayplanner h4{font-family:"Fredoka";font-weight:500;font-size:.8rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.dayplanner .card{border:none;border-radius:0}
.pchip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.pchip{font-family:"Fredoka";font-size:.9rem;cursor:pointer}
.pchip.pjob{font-family:"Atkinson Hyperlegible";font-size:.88rem}
.pwho{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.d-ok{background:var(--ok)} .d-miss{background:#c0553f} .d-part{background:var(--pending)} .d-gray{background:var(--line)}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);overflow-x:auto}
.wcol{border-right:1px solid var(--line);padding:6px;min-width:96px}
.wcol:last-child{border-right:none}
.wcol.wtoday{background:var(--star-soft)}
.whead{width:100%;text-align:center;font-family:"Fredoka";font-size:.78rem;color:var(--adult);padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.whead span{font-size:1rem}
.wdp{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px}
.wchip{font-size:.72rem;background:var(--bg);border-radius:6px;padding:3px 6px;margin:2px 0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
@media(max-width:860px){.weekgrid{grid-template-columns:repeat(7,minmax(96px,1fr))}}
.nowlabel{font-family:"Fredoka";font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.krow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
.krow:last-child{border-bottom:none}
.krow .rmeta{flex:1;text-align:right}
.krow.kdone{color:var(--muted)}
.caughtup{padding:8px 0 2px;font-family:"Fredoka";color:var(--ok);font-size:.9rem}
.dpsec.dpnow{background:var(--star-soft)}
.fyirow{padding:9px 14px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}
.kdp h4{font-family:"Fredoka";font-weight:500;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 14px 2px;border-top:1px solid var(--line)}
.kdp:first-child h4{border-top:none}
.catchlabel{color:#a1512f !important}

/* ---------- adult view ---------- */
.agrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
@media(max-width:860px){.agrid{grid-template-columns:1fr}}
.sect h3{font-size:1rem;margin:2px 0 8px;color:var(--adult)}
.sect .dplabel{font-size:.85rem;margin:10px 0 6px;color:var(--muted);font-weight:600}
.sect .dplabel:first-of-type{margin-top:0}
.secthead{display:flex;justify-content:space-between;align-items:center}
.sub{list-style:none;padding:4px 0 8px 56px}
.sub li{padding:4px 0}
.sub .chk{padding:4px 0;font-size:.92rem}
.sub .box{width:22px;height:22px;border-radius:6px}
.carry{color:#a1512f;font-weight:700}
.carry::after{content:" • carried over";font-weight:400;font-size:.72rem}
.vq .tile{align-items:flex-start}

.settings .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.9rem}

.settings input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:130px;font-family:inherit}
.settings select{border:1px solid var(--line);border-radius:8px;padding:6px;font-family:inherit}
.iobtns{display:flex;gap:8px;padding:12px 14px}
.iobtns button{flex:1;border:1.5px solid var(--adult);color:var(--adult);border-radius:10px;padding:9px;font-family:"Fredoka";font-size:.85rem}
.notice{background:var(--pending-soft);border-radius:10px;padding:8px 12px;font-size:.8rem;color:#7a5716;margin-bottom:10px}
.empty{padding:16px;color:var(--muted);font-size:.88rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-family:"Fredoka";font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}

/* ---------- money (allowance) — kid page, themed by the kid's hue ---------- */
.kidcol{--k-bg:oklch(0.975 0.025 var(--hue));--k-muted:oklch(0.55 0.05 var(--hue));--k-lock:oklch(0.82 0.05 var(--hue));--k-save:oklch(0.63 0.23 var(--hue));--k-share:oklch(0.79 0.17 var(--hue));--k-spend:oklch(0.90 0.10 var(--hue))}
.moneydoor{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:6px;font-family:"Fredoka";font-size:1.1rem;color:#fff;cursor:pointer}
.kidhead .doors{display:flex;gap:8px;align-items:center}
.mp{background:var(--k-bg);border-radius:var(--r);padding:14px 14px 24px;font-family:"Fredoka","Atkinson Hyperlegible",system-ui,sans-serif;color:var(--k-ink)}

.avatar{width:38px;height:38px;border-radius:50%;background:var(--k-accent,var(--adult));color:var(--k-ink,#fff);display:inline-grid;place-items:center;font-weight:700;font-size:1.1rem;overflow:hidden;flex:none;vertical-align:middle}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.mp .steps i{width:13px;height:13px;border-radius:50%;background:var(--k-jar);border:3px solid var(--k-accent);display:block}

.mp .backbtn{color:var(--k-main);font-family:"Fredoka"}
.mp .mcard{background:#fff;border-radius:24px;padding:24px 24px 22px;box-shadow:0 10px 0 var(--k-jar);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:940px;margin:0 auto}
.mp h1{font-size:2rem;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--k-ink)}
.mp p{margin:0;color:var(--k-muted);font-size:1.15rem;max-width:36ch}
.mp .head{display:flex;flex-direction:column;gap:6px;align-items:center}
.mp .big{font-size:4rem;font-weight:700;color:var(--k-main);line-height:1}
.mp .banner{align-self:stretch;background:var(--k-soft);color:var(--k-main);font-weight:700;font-size:1.15rem;border-radius:999px;padding:10px 20px}
.mp .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.mp .go{background:var(--k-accent);color:var(--k-ink);font-weight:700;font-size:1.3rem;padding:14px 36px;border-radius:999px}

.mp .money{width:100%;position:relative;display:flex;flex-direction:column}

.mp .jar.wait{border:3px dashed var(--k-lock);background:transparent;border-top:3px dashed var(--k-lock)}

.mp .jar.wait.source{box-shadow:0 0 0 5px var(--money)}
.mp .choicecoin{background:var(--money);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:1.05rem;line-height:1.05}

.mp .coins{min-height:104px}

.mp .coin span{display:block;font-size:.85rem;color:var(--k-muted);font-weight:500;margin-top:4px}
.mp .coin.flying{animation:mdrop .7s ease-in forwards}
.mp .choicecoin.flying{animation:mrise .7s ease-in forwards}

@keyframes mrise{to{transform:translateX(-120px) scale(.4);opacity:0}}
.mp .jar{display:block;font-family:inherit;font-size:1rem;background:var(--k-jar);border-radius:22px;padding:16px 10px 12px;text-align:center;border-top:12px solid var(--k-main);position:relative;transition:transform .2s,box-shadow .2s;min-width:0}
.mp .jar.bump{transform:translateY(-8px)}
.mp .jar .amt{font-size:clamp(20px,3.2vw,36px);font-weight:700;color:var(--k-main);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.mp .jar .lbl{font-size:1rem;color:var(--k-muted);margin-top:6px;font-weight:500}

.mp .jar.j-spend{border-top-color:var(--k-spend)} .mp .jar.j-save{border-top-color:var(--k-save)} .mp .jar.j-share{border-top-color:var(--k-share)}
.mp .jar.tap{cursor:pointer;outline:4px dashed var(--money);outline-offset:-4px}

.mp .between{display:flex;flex-direction:column;gap:6px;align-items:center;justify-self:center}

.mp .goal{display:flex;align-items:center;gap:20px;width:100%;text-align:left}

.mp .goal .img img{width:100%;height:100%;object-fit:cover}
.mp .goal .info{flex:1}
.mp .goal .info b{font-size:1.5rem;display:block;margin-bottom:6px}
.mp .goal .info span{color:var(--k-muted)}
.mp .bar{height:26px;background:var(--k-jar);border-radius:999px;overflow:hidden;margin-top:8px}
.mp .bar div{height:100%;background:var(--k-accent);border-radius:999px;transition:width .8s ease}
.mp .wish{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mp .wish .wbtn{width:140px;background:var(--k-soft);border-radius:20px;padding:12px;color:var(--k-ink);font-weight:600;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.mp .wish .wbtn .img{width:96px;height:96px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:2.6rem}
.mp .wish .wbtn.unsure{background:transparent;border:4px dashed var(--k-lock);color:var(--k-main)}
.mp .wish .wbtn.unsure .img{background:transparent}
.mp .wish .wbtn .rank{display:flex;gap:6px}
.mp .wish .wbtn .rank button,.mp .wish .wbtn .trash{background:#fff;border-radius:999px;width:32px;height:32px;font-size:1rem}
.mp .wish .wbtn .trash{position:absolute;top:8px;right:8px;color:#b3543f}
.mp .wish .wbtn .price{font-size:.85rem;color:var(--k-muted);font-weight:500}
.mp .wish .wbtn .savebtn{background:var(--k-accent);color:var(--k-ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.95rem}
.mp .wish .wbtn .savebtn:disabled{opacity:.4}
.mp .chart{width:100%;text-align:left}
.mp .chart h2{font-size:1.2rem;margin:0 0 6px;font-weight:600}
.mp .chart svg{width:100%;height:auto;display:block}
.mp .doorrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mp .doorbtn{background:var(--k-soft);color:var(--k-ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:1.05rem}
.mp .newwish{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.mp .newwish input{font-family:inherit;font-size:1.05rem;border:2px solid var(--k-lock);border-radius:12px;padding:8px 10px}
.mp .emojis{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.mp .emojis button{font-size:1.4rem;width:40px;height:40px;border-radius:10px}
.mp .emojis button.on{background:var(--k-soft)}
.mp .story{width:100%;text-align:left}
.mp .story .day{font-size:.85rem;color:var(--k-muted);margin:12px 0 4px;font-weight:600}
.mp .ev{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:6px}
.mp .ev .ic{font-size:1.6rem;width:40px;text-align:center}
.mp .ev .txt{flex:1;display:flex;flex-direction:column}
.mp .ev .txt span{font-size:.9rem;color:var(--k-muted)}
.mp .ev .amt{font-weight:700;white-space:nowrap;text-align:right}
.mp .ev .amt.plus{color:var(--money)}
.mp .ev .amt small{display:block;font-size:.7rem;font-weight:500;color:var(--k-muted)}
.mp .filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mp .filters button{border-radius:999px;padding:6px 14px;background:#fff;color:var(--k-ink);font-weight:600}
.mp .filters button.on{background:var(--k-accent)}
@media(max-width:640px){.mp .strip{grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr) 54px minmax(0,1fr)}.mp .coin{width:76px;height:76px;font-size:1.2rem}.mp .move{width:46px;font-size:1.05rem}.mp .goal{flex-direction:column;text-align:center}.mp h1{font-size:1.5rem}.mp .big{font-size:3rem}}
/* allowance-day banner on the kid's board */
.allowbanner{background:var(--money-soft);border:2px solid var(--money);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:"Fredoka";font-size:1.05rem}
.allowbanner button{background:var(--money);color:#fff;border-radius:999px;padding:8px 16px;font-family:"Fredoka";font-weight:600}
/* adult money section */
.money-adult .kidsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.money-adult .bal{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}
.money-adult .bal span{background:var(--bg);border-radius:8px;padding:4px 8px}
.money-adult .bal b{font-variant-numeric:tabular-nums}
.money-adult .runrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:.9rem}
.money-adult .runrow.pend{background:var(--pending-soft)}
.money-adult .btns{display:flex;gap:6px;flex-wrap:wrap}
.money-adult .btns button,.money-adult .pri{border:1.5px solid var(--adult);color:var(--adult);border-radius:999px;padding:4px 10px;font-size:.8rem;font-family:"Fredoka"}
.money-adult .btns button.pri,.money-adult button.pri{background:var(--adult);color:#fff}
.money-adult .btns button.bad{border-color:#b3543f;color:#b3543f}
.money-adult .addline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.money-adult .addline input,.money-adult .addline select,.money-adult .gtable input{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-family:inherit;font-size:.85rem}
.money-adult table.ledger td.num,.money-adult table.ledger th.num{text-align:right;font-variant-numeric:tabular-nums}
.money-adult tr.sys td{color:var(--muted)}
.money-adult tr.newrow td{background:var(--money-soft)}
.money-adult .diff{background:var(--pending-soft);padding:10px 14px;font-size:.85rem}
.money-adult .subtabs{display:flex;gap:4px;padding:8px 14px 0}
.money-adult .subtabs button{border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.money-adult .subtabs button.on{background:var(--adult);color:#fff}
.money-adult .badge.ok{background:var(--money-soft);color:#1f6b36}
.money-adult .badge.bad{background:#f6dcd6;color:#8a3b2c}
.money-adult .note{font-size:.78rem;color:var(--muted);padding:6px 14px}
.money-adult .gtable{width:100%;border-collapse:collapse;font-size:.85rem}
.money-adult .gtable th,.money-adult .gtable td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.money-adult .gtable input[type=text]{width:100%}
/* ---------- rewards: kid page ---------- */
.rp .starsbig{font-size:2.6rem;font-weight:700;color:var(--star);line-height:1.1}
.rp .starsbig small{display:block;font-size:.9rem;font-weight:500;color:var(--k-muted)}
.rp .lanes{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.rp .lane{border-radius:20px;padding:12px}
.rp .lane.mine{background:var(--k-bg)}
.rp .lane.shop{background:#fff;border:3px solid var(--k-soft)}

.rp .lane.shop .rrow.cashout{background:var(--money-soft);box-shadow:inset 0 0 0 3px var(--money)}
.rp .lane.shop .rrow.cashout .img{background:#fff}
.rp .rrow.cashout .go{background:var(--money);color:#fff}
.rp .rrow.pend{box-shadow:inset 0 0 0 3px var(--star)}
.rp .rrow.pend .img{background:var(--star-soft);color:#8a6414;font-weight:700}
.rp .lanehead{font-weight:700;font-size:1.05rem;color:var(--k-main);margin-bottom:8px}
.rp .sec{margin-bottom:14px}
.rp .sec h2{font-size:1.05rem;margin:0 0 8px;font-weight:600}
.rp .rrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:10px}
.rp .rrow.up{box-shadow:inset 0 0 0 3px var(--k-accent)}
.rp .lane.shop .rrow.mine{background:var(--k-jar);box-shadow:inset 0 0 0 2px var(--k-accent)}
.rp .rrow .img{width:56px;height:56px;border-radius:14px;background:var(--k-soft);display:grid;place-items:center;font-size:1.8rem;flex:none}
.rp .rrow .img.dashed{background:transparent;border:3px dashed var(--k-lock)}
.rp .rrow .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rp .rrow .info b{font-size:1.05rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rp .rrow .info span{font-size:.9rem;color:var(--k-muted)}
.rp .chip{background:var(--star-soft);color:#8a6414;border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:600}
.rp .st{color:#8a6414;font-weight:700}
.rp .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.rp .go.small{font-size:.95rem;padding:8px 14px}
.rp .notnow.small{font-size:.9rem;padding:8px 12px;border-width:3px}
.rp .goalbtn{background:var(--star-soft);color:#8a6414;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.95rem}
.rp .goalbtn:disabled{opacity:.6}
.rp .acts.cash button{min-width:52px}
.rp .bar{height:18px;margin-top:6px}
.rp .ask{background:var(--k-soft);border-radius:20px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.rp .ask .img{width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:2rem}
.rp .ask h2{font-size:1.3rem;margin:0}
.rp .ask textarea{width:100%;max-width:420px;min-height:60px;border:2px solid var(--k-lock);border-radius:12px;padding:8px;font-family:inherit;font-size:1rem}
.rp .ask .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stardoor{cursor:pointer}
.pendchip{font-size:.7rem;background:rgba(255,255,255,.85);color:#8a6414;border-radius:999px;padding:1px 6px;margin-left:4px;font-weight:600}
.pendchip.money{background:var(--money);color:#fff}
.kidhead .avatar{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.huedoor{background:transparent;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:#fff}
.huedoor.on{background:rgba(255,255,255,.25)}
.huerow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-family:"Fredoka"}
.huerow .swatches button{width:30px;height:30px}
</style>
</head>

</div>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================

const DEFAULT_DATA = () => ({
  version: "1.5",

              starsOnDefault: "verify", photoMode: "optional",

  people: [ // role adult | child | vendor; hue is one of HUE_PRESETS (children only); weekly amounts in dollars
    { id:"k1", name:"Levon",   role:"child", hue:68,  weekly:{spend:1,save:1,share:1,choice:1}, bonusCapPerDay:3 },

    { id:"a2", name:"Dad",     role:"adult" },
  ],
  registry: [
    // --- kid chores (household) ---
    { id:"c_room",  name:"Straighten your room", category:"household", ownerType:"child",
      accountable:"a1", policy:"static", perKid:true, schedule:{type:"fixed", days:[0]}, // Sunday
      estMin:10, kidVisible:true, stars:1, starsOn:"verify" },
    { id:"c_play",  name:"Tidy playroom (10 min)", category:"household", ownerType:"child",
      accountable:"a1", policy:"open", claimMode:"participatory", schedule:{type:"fixed", days:[0,1,2,3,4,5,6]},
      estMin:10, timerMin:10, timerGate:true, photoReq:true, kidVisible:true, stars:2, starsOn:"verify", expectation:"expected",
      notes:"Everything off the floor and back in its bin. The timer counts your 10 minutes — everyone who does their time earns their stars." },
    { id:"c_out",   name:"Tidy outside toys", category:"household", ownerType:"child",
      accountable:"a1", policy:"open", claimMode:"exclusive", schedule:{type:"fixed", days:[0,1,2,3,4,5,6]},
      estMin:8, kidVisible:true, stars:2, starsOn:"verify" },
    { id:"c_weed",  name:"Weeding (10 min)", category:"household", ownerType:"child",
      accountable:"a1", policy:"open", claimMode:"participatory", schedule:{type:"quota", count:1, period:"week"},
      estMin:10, timerMin:10, timerGate:true, kidVisible:true, stars:1, starsOn:"verify" },

/* ---- date helpers ---- */
const todayKey = d => { const x=new Date(d), p=n=>String(n).padStart(2,"0"); return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; }; // local calendar date, never UTC
const dow = d => d.getDay(); // 0=Sun
function weekKey(d, weekStart){ // key of the week containing d
  const x = new Date(d); const diff = (x.getDay() - weekStart + 7) % 7;
  x.setDate(x.getDate() - diff); return todayKey(x);
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }


/* =========================================================================
   MONEY MODEL — allowance ledger, runs, goals. Pure functions over data.
   Schema v1.5 sections: Money, Allowance runs, Interest regeneration, Goals.
   Rows are append-only for user origin; interest rows are system-owned and
   regenerate. Balances are always sums; nothing stores a total.
   ========================================================================= */
const ACCTS=["spend","save","share","holding"];
const r2=n=>Math.round(n*100)/100;
function roundCent(n){ return (n<0?-1:1)*Math.round(Math.abs(n)*100+1e-9)/100; } // half away from zero
const fmtMoney=n=>(n<0?"−":"")+"$"+Math.abs(n).toFixed(2).replace(/\.00$/,"");
const fmtMoneyC=n=>(n<0?"−":"")+"$"+Math.abs(n).toFixed(2);
function md(dk){ const [y,m,d]=dk.split("-").map(Number); return `${m}/${d}`; }
function dowName(i){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][i]; }
function addDaysKey(dk,n){ const d=new Date(dk+"T12:00:00"); d.setDate(d.getDate()+n); return todayKey(d); }
function dowOfKey(dk){ return new Date(dk+"T12:00:00").getDay(); }

function ensureMoney(data){ // v1.5 collections; safe on any saved data
  data.money=data.money||[]; data.runs=data.runs||[]; data.goals=data.goals||[];
  data.seq=data.seq||(data.money.length+data.runs.length+data.goals.length+1);
}
function nextId(data,prefix){ ensureMoney(data); data.seq++; return uid(prefix); }
function kidRate(data,kid){ return kid.interestRateOverride??data.settings.interestRate; }

/* ---- ledger ---- */
function rowOrder(a,b){ // imported rows keep the sheet's own order within a day; board rows put interest last within a day
  if(a.importTag&&b.importTag&&a.date===b.date) return (a.iseq||0)-(b.iseq||0);
  return a.date.localeCompare(b.date) || ((a.type==="interest")-(b.type==="interest")) || (a.seq-b.seq); }
function rowsFor(data,kidId){ return data.money.filter(r=>r.kid===kidId).sort(rowOrder); }
function balances(data,kidId,asOf){ // sums per account; asOf (date key) limits to rows dated on or before it
  const b={spend:0,save:0,share:0,holding:0};
  for(const r of data.money){ if(r.kid!==kidId) continue; if(asOf&&r.date>asOf) continue; b[r.acct]=r2(b[r.acct]+r.amt); }
  return b;
}
function addRow(data,f){ // f: {kid,date,acct,amt,type,note,goalId,linkId,origin,rate,base,runId,image}
  ensureMoney(data);
  const seq=data.seq++, row={origin:"user",...f,id:uid("m"),seq}; row.amt=r2(row.amt);
  data.money.push(row); return row;
}
function transfer(data,kidId,date,from,to,amt,runId,note){
  const link=nextId(data,"t");
  addRow(data,{kid:kidId,date,acct:from,amt:-amt,type:"transfer",linkId:link,runId,note});
  addRow(data,{kid:kidId,date,acct:to,amt:amt,type:"transfer",linkId:link,runId,note});
}
function lastInterestDate(data,kidId){ return data.money.filter(r=>r.kid===kidId&&r.type==="interest").map(r=>r.date).sort().pop()||null; }

/* ---- money claims: a kid says money arrived; an adult confirms; it posts to holding until allowance day ---- */
function ensureClaims(data){ data.moneyClaims=data.moneyClaims||[]; }
function addClaim(data,kidId,amount,from){ ensureClaims(data); const c={id:(data.seq++,uid("mc")),kid:kidId,amount:r2(amount),from:(from||"").trim(),status:"requested",requestedAt:new Date().toISOString()}; data.moneyClaims.push(c); return c; }
function confirmClaim(data,id,amount){ const c=(data.moneyClaims||[]).find(x=>x.id===id); if(!c||c.status!=="requested") return null;
  const amt=amount??c.amount; c.status="confirmed"; c.resolvedAt=new Date().toISOString(); c.amount=r2(amt);
  const row=addRow(data,{kid:c.kid,date:c.requestedAt.slice(0,10),acct:"holding",amt:r2(amt),type:"gift_in",note:c.from?`From ${c.from}`:"Money received",claimId:c.id}); c.rowId=row.id; return row; }
function declineClaim(data,id){ const c=(data.moneyClaims||[]).find(x=>x.id===id); if(c&&c.status==="requested"){ c.status="declined"; c.resolvedAt=new Date().toISOString(); } }
function pendingClaims(data,kidId){ return (data.moneyClaims||[]).filter(c=>c.status==="requested"&&(!kidId||c.kid===kidId)); }

/* ---- allowance runs ---- */
function runsFor(data,kidId){ return data.runs.filter(r=>r.kid===kidId).sort((a,b)=>a.date.localeCompare(b.date)); }
function pendingRuns(data,kidId){ return runsFor(data,kidId).filter(r=>r.status==="pending"); }
function generateRuns(data,today){ // one pending run per child for each allowance day that has passed since the last run (or last interest line)
  ensureMoney(data);
  const dk=todayKey(today), ad=data.settings.allowanceDay;
  for(const kid of data.people.filter(p=>p.role==="child")){
    const runs=runsFor(data,kid.id);
    const last=[...runs.map(r=>r.date), lastInterestDate(data,kid.id)].filter(Boolean).sort().pop();
    let next;
    if(last){ next=addDaysKey(last,1); while(dowOfKey(next)!==ad) next=addDaysKey(next,1); }
    else { next=dk; while(dowOfKey(next)!==ad) next=addDaysKey(next,-1); } // first ever run: the most recent allowance day, no history backfill
    while(next<=dk){
      if(!runs.some(r=>r.date===next)) data.runs.push({id:nextId(data,"r"),kid:kid.id,date:next,status:"pending",posted:false});
      next=addDaysKey(next,7);
    }
  }
}
function postAllowance(data,run){ // fixed amounts to the three jars, choice dollar to holding; once per run
  if(run.posted) return;
  const kid=data.people.find(p=>p.id===run.kid), w=kid.weekly||{spend:1,save:1,share:1,choice:1};
  for(const a of ["spend","save","share"]) if(w[a]>0) addRow(data,{kid:kid.id,date:run.date,acct:a,amt:w[a],type:"allowance_fixed",runId:run.id});
  if(w.choice>0) addRow(data,{kid:kid.id,date:run.date,acct:"holding",amt:w.choice,type:"allowance_choice",runId:run.id});
  run.posted=true;
}
function postInterest(data,run){ // rate × full save balance at end of the allowance day, dated to that day; one row per completed run, even at $0
  const kid=data.people.find(p=>p.id===run.kid), rate=kidRate(data,kid);
  const base=balances(data,kid.id,run.date).save; // interest rows dated later are excluded by date; this run's own interest is not yet written
  const row=addRow(data,{kid:kid.id,date:run.date,acct:"save",amt:roundCent(base*rate),type:"interest",origin:"system",rate,base,runId:run.id});
  return row;
}
function completeRun(data,run,how){ // how: "kid" | "adult" | "system" (catch-up)
  if(run.status!=="pending") return null;
  postAllowance(data,run);
  const row=postInterest(data,run);
  run.status="complete"; run.completedAt=new Date().toISOString(); run.completedBy=how;
  checkGoals(data,run.kid);
  return row;
}
function skipRun(data,run,note){ if(run.status!=="pending") return; run.status="skipped"; run.note=note; run.completedAt=new Date().toISOString(); }
function catchUp(data,kidId){ // several runs pending: older ones complete system-side in date order, only the newest stays interactive
  const pend=pendingRuns(data,kidId);
  for(const r of pend.slice(0,-1)) completeRun(data,r,"system");
  return pend.length?pend[pend.length-1]:null;
}

/* ---- interest regeneration ---- */
function regenerate(data,kidId,extraRows){ // returns [{row, old, amt, base}] for every system interest row whose amount would change
  const rows=rowsFor(data,kidId).concat(extraRows||[]).sort(rowOrder);
  let save=0; const changes=[];
  for(const r of rows){
    if(r.acct!=="save") continue;
    if(r.type==="interest"&&!r.importTag){ // imported interest lines are historical fact under the old sheet's method; never regenerated
      const amt=roundCent(save*r.rate);
      if(amt!==r.amt) changes.push({row:r,old:r.amt,amt,base:r2(save)});
      save=r2(save+amt);
    } else save=r2(save+r.amt);
  }
  return changes;
}
function applyRegen(changes){ for(const c of changes){ c.row.amt=c.amt; c.row.base=c.base; c.row.regeneratedAt=new Date().toISOString(); } }
function needsRegen(data,kidId,row){ const li=lastInterestDate(data,kidId); return !!li && row.acct==="save" && row.date<=li; }

/* ---- goals (money currency in this build) ---- */
function goalsFor(data,kidId){ return data.goals.filter(g=>g.kid===kidId); }
function activeGoal(data,kidId){ return goalsFor(data,kidId).find(g=>g.status==="active"&&g.currency==="money"); }
function achievedUnbought(data,kidId){ return goalsFor(data,kidId).filter(g=>g.status==="achieved"&&!data.money.some(r=>r.goalId===g.id&&r.type==="purchase")); }
function wishlist(data,kidId){ return goalsFor(data,kidId).filter(g=>g.status==="wishlist"&&g.currency==="money").sort((a,b)=>(a.rank??99)-(b.rank??99)); }
function addWish(data,kidId,title,emoji){
  const g={id:nextId(data,"g"),kid:kidId,title,emoji,currency:"money",status:"wishlist",addedAt:todayKey(new Date()),rank:wishlist(data,kidId).length,onHand:false,url:"",notes:""};
  data.goals.push(g); return g;
}
function activateGoal(data,goalId){ // one active per currency per child, enforced by flow: the current one goes back to the wishlist
  const g=data.goals.find(x=>x.id===goalId); if(!g||g.target==null) return false;
  const cur=activeGoal(data,g.kid); if(cur&&cur.id!==g.id){ cur.status="wishlist"; cur.rank=-1; renumber(data,cur.kid); }
  g.status="active"; g.activatedAt=todayKey(new Date());
  checkGoals(data,g.kid); return true;
}
function renumber(data,kidId){ wishlist(data,kidId).forEach((g,i)=>g.rank=i); }
function moveWish(data,goalId,dir){ const g=data.goals.find(x=>x.id===goalId); const list=wishlist(data,g.kid); const i=list.indexOf(g), j=i+dir; if(j<0||j>=list.length) return; list[i].rank=j; list[j].rank=i; }
function dropGoal(data,goalId){ const g=data.goals.find(x=>x.id===goalId); if(!g) return; g.status="dropped"; g.droppedAt=todayKey(new Date()); renumber(data,g.kid); }
function checkGoals(data,kidId){ // achieved fires when save ≥ target; the purchase row (adult) closes it
  const g=activeGoal(data,kidId); if(!g) return null;
  if(balances(data,kidId).save>=g.target){ g.status="achieved"; g.achievedAt=todayKey(new Date()); return g; }
  return null;
}
function recordPurchase(data,goalId,amount,date){
  const g=data.goals.find(x=>x.id===goalId); if(!g) return null;
  const row=addRow(data,{kid:g.kid,date:date||todayKey(new Date()),acct:"save",amt:-Math.abs(amount),type:"purchase",goalId:g.id,note:g.title});
  if(g.status!=="achieved"){ g.status="achieved"; g.achievedAt=row.date; }
  return row;
}

/* ---- history for the kid's chart: balances as of each completed run, plus now ---- */
function history(data,kidId){
  const runs=runsFor(data,kidId).filter(r=>r.status==="complete").slice(-14);
  const pts=runs.map(r=>({label:md(r.date),...balances(data,kidId,r.date)}));
  pts.push({label:"now",...balances(data,kidId)});
  return pts;
}

/* ---- story: ledger rows in kid words ---- */
function storyEvents(data,kidId){
  const rows=rowsFor(data,kidId).slice().reverse(), out=[], seen=new Set();
  const kidName=nameOf(kidId);
  for(const r of rows){
    if(r.type==="allowance_fixed"||r.type==="allowance_choice"){
      if(seen.has("al:"+r.runId)) continue; seen.add("al:"+r.runId);
      const tot=data.money.filter(x=>x.runId===r.runId&&(x.type==="allowance_fixed"||x.type==="allowance_choice")).reduce((s,x)=>s+x.amt,0);
      out.push({d:r.date,ic:"🎉",t:"Allowance day",s:"Money to your jars, and one dollar for you to choose",amt:"+ "+fmtMoney(tot),plus:true,jar:null,kind:"allowance"}); continue; }
    if(r.type==="transfer"){
      if(seen.has("tr:"+r.linkId)) continue; seen.add("tr:"+r.linkId);
      const pair=data.money.filter(x=>x.linkId===r.linkId), from=pair.find(x=>x.amt<0), to=pair.find(x=>x.amt>0);
      out.push({d:r.date,ic:from.acct==="holding"?"👉":"↔️",t:from.acct==="holding"?`Put ${fmtMoney(to.amt)} in ${to.acct}`:`Moved ${fmtMoney(to.amt)} from ${from.acct} to ${to.acct}`,s:r.runId?"On allowance day":(r.note||""),amt:fmtMoney(to.amt),jar:to.acct}); continue; }
    if(r.type==="interest"){ out.push({d:r.date,ic:"🌱",t:"Your save money grew",s:`${Math.round(r.rate*100)}% interest on ${fmtMoneyC(r.base)}`,amt:"+ "+fmtMoneyC(r.amt),plus:true,jar:"save"}); continue; }
    if(r.type==="purchase"){ out.push({d:r.date,ic:r.goalId?"🎁":"🛍️",t:`Bought ${r.note||"something"}`,s:`From your ${r.acct} jar`,amt:"− "+fmtMoney(-r.amt),jar:r.acct,buy:true}); continue; }
    if(r.type==="gift_in"){ out.push({d:r.date,ic:"🎁",t:r.note||"A gift",s:"",amt:"+ "+fmtMoney(r.amt),plus:true,jar:r.acct}); continue; }
    if(r.type==="earnings"){ out.push({d:r.date,ic:"💪",t:r.note||"You earned money",s:"",amt:"+ "+fmtMoney(r.amt),plus:true,jar:r.acct}); continue; }
    if(r.type==="share_out"){ out.push({d:r.date,ic:"💗",t:r.note||"Shared with someone",s:"From your share jar",amt:"− "+fmtMoney(-r.amt),jar:"share"}); continue; }
    if(r.type==="star_cashout"){ out.push({d:r.date,ic:"⭐",t:"Traded stars for money",s:"Waiting for you to choose a jar",amt:"+ "+fmtMoney(r.amt),plus:true,jar:"holding"}); continue; }
    out.push({d:r.date,ic:r.amt>=0?"➕":"➖",t:r.note||"Mom fixed something",s:"",amt:(r.amt>=0?"+ ":"− ")+fmtMoney(Math.abs(r.amt)),plus:r.amt>=0,jar:r.acct});
  }
  for(const r of (data.starLedger||[]).filter(x=>x.kid===kidId)){ // star ledger: redemptions and adjustments (earned stars show on the board itself)
    if(r.type==="redeemed"){ const rd=(data.redemptions||[]).find(x=>x.id===r.redemptionId), rw=rewardById(data,r.rewardId);
      out.push({d:r.date,ic:rw?.kind==="cashout"?"💵":"⭐",t:rw?.kind==="cashout"?`Traded ${-r.amt} ★ for ${fmtMoney(rd?.amountUsd||0)}`:`Traded ${-r.amt} ★ for ${rw?.title||"a reward"}`,s:rd?.kidNote?`You said: "${rd.kidNote}"`:"",amt:`− ${-r.amt} ★`,star:true,seq:r.seq}); }
    else out.push({d:r.date,ic:"⭐",t:r.note||"Star adjustment",s:"",amt:`${r.amt>0?"+":"−"} ${Math.abs(r.amt)} ★`,plus:r.amt>0,star:true,seq:r.seq});
  }
  out.forEach((e,i)=>{ if(e.seq===undefined) e.seq=1e6-i; }); // money events were built newest-first; keep that order within a day
  out.sort((a,b)=>b.d.localeCompare(a.d)||((b.seq||0)-(a.seq||0)));
  return out;
}


/* =========================================================================
   STARS + REWARDS MODEL — schema v1.5 sections: Stars, Rewards, Redemptions,
   Goals (stars currency). Earned stars derive from the occurrence log; the
   star ledger holds only redemptions and adjustments (append-only).
   ========================================================================= */
function ensureRewards(data){
  data.rewards=data.rewards||[]; data.redemptions=data.redemptions||[]; data.starLedger=data.starLedger||[];
  if(!data.rewards.some(r=>r.kind==="cashout")) data.rewards.unshift({id:"rw_cash",title:"Cash out",emoji:"💵",kind:"cashout",repeatable:true,active:true,scope:"family",notes:"",addedAt:todayKey(new Date())});
}
function seedRewards(data){ // illustrative defaults only; the family prices its own
  ensureRewards(data);
  if(data.rewards.length>1) return;
  const t=todayKey(new Date());
  data.rewards.push(
    {id:"rw_movie",title:"Pick the movie",emoji:"🎬",starCost:8,kind:"privilege",repeatable:true,active:true,scope:"family",notes:"",addedAt:t},
    {id:"rw_screen",title:"Extra screen time",emoji:"📺",starCost:12,kind:"privilege",repeatable:true,active:true,scope:"family",notes:"20 minutes",addedAt:t},
    {id:"rw_bed",title:"Late bedtime",emoji:"🌙",starCost:15,kind:"privilege",repeatable:true,active:true,scope:"family",notes:"30 extra minutes",addedAt:t},
    {id:"rw_ice",title:"Family ice cream night",emoji:"🍦",starCost:30,kind:"privilege",repeatable:true,active:true,scope:"family",notes:"",addedAt:t});
}

const starOwner=i=>i.pid==="__open__"?i.claimedBy:i.pid; // an open task's stars belong to whoever claimed it
function earnedStars(data,kidId){ let n=0; for(const i of data.instances){ if(starOwner(i)===kidId&&i.starsEarned) n+=i.starsEarned; } return n; }
function starLedgerSum(data,kidId){ return (data.starLedger||[]).filter(r=>r.kid===kidId).reduce((s,r)=>s+r.amt,0); }
function starBalance(data,kidId){ return earnedStars(data,kidId)+starLedgerSum(data,kidId); }
function reservedStars(data,kidId){ return (data.redemptions||[]).filter(r=>r.kid===kidId&&r.status==="requested").reduce((s,r)=>s+r.starCost,0); }
function availableStars(data,kidId){ return starBalance(data,kidId)-reservedStars(data,kidId); }
function pendingStarItems(data,kidId){ // done, not yet verified, stars still to come (stars_on = verify)
  return data.instances.filter(i=>starOwner(i)===kidId&&i.cid&&i.state==="done"&&!i.starsEarned).map(i=>{ const c=data.registry.find(x=>x.id===i.cid); const mode=c?.starsOn||data.settings.starsOnDefault; return c&&c.stars&&mode==="verify"?{inst:i,c,stars:c.stars}:null; }).filter(Boolean);
}
function pendingStars(data,kidId){ return pendingStarItems(data,kidId).reduce((s,x)=>s+x.stars,0); }
function starRow(data,f){ ensureRewards(data); const seq=data.seq++, row={date:todayKey(new Date()),...f,id:uid("s"),seq}; data.starLedger.push(row); return row; }
function migrateStars(data){ // v0.18 → v0.19: freeze earned stars on instances, reconcile the old stored total with an adjustment row, drop the stored total
  ensureRewards(data);
  if(!data.stars) return;
  for(const i of data.instances){
    if(i.starsEarned!==undefined) continue;
    if(i.cid){ const c=data.registry.find(x=>x.id===i.cid); if(i.starred&&c?.stars) i.starsEarned=c.stars; }
    else if(i.rid){ const r=data.routines.find(x=>x.id===i.rid); if(i.state==="verified"&&r?.starMode==="whole"&&r.stars) i.starsEarned=r.stars; }
  }
  for(const [kid,total] of Object.entries(data.stars)){
    const diff=(total||0)-earnedStars(data,kid);
    if(diff) starRow(data,{kid,amt:diff,type:"adjustment",note:"Balance carried over from before v0.19",origin:"system"});
  }
  delete data.stars;
}
/* ---- catalog ---- */
function rewardsFor(data,kidId){ return (data.rewards||[]).filter(r=>r.active&&(r.scope==="family"||r.scope===kidId)); }
function rewardById(data,id){ return (data.rewards||[]).find(r=>r.id===id); }
function addReward(data,f){ ensureRewards(data); const r={id:(data.seq++,uid("rw")),emoji:"🎁",kind:"privilege",repeatable:true,active:true,scope:"family",notes:"",addedAt:todayKey(new Date()),...f}; data.rewards.push(r); return r; }
/* ---- redemptions ---- */
function redemptionsFor(data,kidId){ return (data.redemptions||[]).filter(r=>r.kid===kidId).sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||"")); }
function requestRedemption(data,kidId,rewardId,opts={}){ // price frozen at request; stars reserved, not deducted
  ensureRewards(data); const rw=rewardById(data,rewardId); if(!rw) return null;
  const starCost=rw.kind==="cashout"?Math.round((opts.amountUsd||1)*data.settings.starsPerDollar):rw.starCost;
  if(availableStars(data,kidId)<starCost&&!opts.auto) return null;
  const r={id:(data.seq++,uid("rd")),kid:kidId,rewardId,status:"requested",starCost,amountUsd:rw.kind==="cashout"?(opts.amountUsd||1):undefined,
    requestedAt:new Date().toISOString(),kidNote:(opts.kidNote||"").trim(),goalId:opts.goalId,auto:!!opts.auto};

}
function withdrawRedemption(data,id){ const r=data.redemptions.find(x=>x.id===id); if(r&&r.status==="requested"){ r.status="withdrawn"; r.withdrawnAt=new Date().toISOString(); checkStarGoals(data,r.kid); } }
function approveRedemption(data,id,scheduledFor,note){ // posts the star row now; cash-out also posts money into holding
  const r=data.redemptions.find(x=>x.id===id); if(!r||r.status!=="requested") return;
  const rw=rewardById(data,r.rewardId);
  r.status="approved"; r.approvedAt=new Date().toISOString(); r.scheduledFor=scheduledFor||null; r.note=(note||"").trim();
  const srow=starRow(data,{kid:r.kid,amt:-r.starCost,type:"redeemed",rewardId:r.rewardId,redemptionId:r.id,note:rw?rw.title:""});
  if(rw?.kind==="cashout"){
    const mrow=addRow(data,{kid:r.kid,date:todayKey(new Date()),acct:"holding",amt:r.amountUsd,type:"star_cashout",note:`${r.starCost} ★ cashed out`,linkId:srow.id});
    srow.linkedMoneyId=mrow.id; r.status="fulfilled"; r.fulfilledAt=r.approvedAt; // money lands immediately; nothing left to fulfil

}
function declineRedemption(data,id,note){ const r=data.redemptions.find(x=>x.id===id); if(!r||r.status!=="requested") return; r.status="declined"; r.declinedAt=new Date().toISOString(); r.note=(note||"").trim(); checkStarGoals(data,r.kid); }
function fulfillRedemption(data,id){ const r=data.redemptions.find(x=>x.id===id); if(!r||r.status!=="approved") return; r.status="fulfilled"; r.fulfilledAt=new Date().toISOString();
  const rw=rewardById(data,r.rewardId); if(rw&&!rw.repeatable) rw.active=false; }
function rescheduleRedemption(data,id,date){ const r=data.redemptions.find(x=>x.id===id); if(r&&r.status==="approved") r.scheduledFor=date||null; }
function overduePromises(data,today){ const dk=todayKey(today); return (data.redemptions||[]).filter(r=>r.status==="approved"&&r.scheduledFor&&r.scheduledFor<dk); }
function upcomingFor(data,kidId){ return redemptionsFor(data,kidId).filter(r=>["requested","approved"].includes(r.status)||(r.status==="fulfilled"&&daysBetween(r.fulfilledAt.slice(0,10),todayKey(new Date()))<14)); }
/* ---- star goals: only from the catalog, target frozen at activation ---- */
function starGoal(data,kidId){ return (data.goals||[]).find(g=>g.kid===kidId&&g.currency==="stars"&&g.status==="active"); }
function setStarGoal(data,kidId,rewardId){
  const rw=rewardById(data,rewardId); if(!rw||rw.kind==="cashout") return null;
  const cur=starGoal(data,kidId); if(cur){ cur.status="dropped"; cur.droppedAt=todayKey(new Date()); }
  const g={id:(data.seq++,uid("g")),kid:kidId,title:rw.title,emoji:rw.emoji,currency:"stars",rewardId,target:rw.starCost,status:"active",addedAt:todayKey(new Date()),activatedAt:todayKey(new Date())};
  data.goals.push(g); checkStarGoals(data,kidId); return g;
}
function dropStarGoal(data,kidId){ const g=starGoal(data,kidId); if(g){ g.status="dropped"; g.droppedAt=todayKey(new Date()); } }
function checkStarGoals(data,kidId){ // reaching a star goal auto-creates a Redemption in requested status at the frozen price
  const g=starGoal(data,kidId); if(!g) return null;
  if(availableStars(data,kidId)>=g.target){
    const rw=rewardById(data,g.rewardId); g.status="achieved"; g.achievedAt=todayKey(new Date());
    const r={id:(data.seq++,uid("rd")),kid:kidId,rewardId:g.rewardId,status:"requested",starCost:g.target,requestedAt:new Date().toISOString(),kidNote:"",goalId:g.id,auto:true};
    data.redemptions.push(r); data.log.push({t:r.requestedAt,msg:`${nameOf(kidId)} reached a star goal: ${rw?rw.title:""} — request waiting in To Review`});
    return r;
  }
  return null;
}

/* ---- instance generation (idempotent per day) ---- */
function generateDay(data, date){
  const dk = todayKey(date), day = dow(date), wk = weekKey(date, data.settings.weekStart);
  // close out stale instances from earlier days
  for(const inst of data.instances){
    if(inst.date && inst.date < dk){
      if(inst.rid){ if(inst.state!=="verified") inst.state="missed"; continue; }
      if(inst.state==="done"){ inst.state="verified"; inst.autoApproved=true; inst.verifiedAt=inst.completedAt; prunePhoto(inst);
        awardIfDue(data, inst, "verify", true); }
      else if(inst.state==="open"||inst.state==="in_process"){ inst.state="missed"; }
    }
  }
  const has = (cid,pid,d)=> data.instances.some(i=>i.cid===cid && i.pid===pid && i.date===d);
  const memberOf={}; for(const r of data.routines) for(const cid of (r.memberRefs||[])) memberOf[cid]=r;
  for(const c of data.registry){
    const rOwner = memberOf[c.id];
    if(rOwner){ // schedule comes from the routine, not the task
      if(rOwner.tracking==="display" || !rOwner.days.includes(day)) continue;
      for(const pid of rOwner.people){ if(!has(c.id,pid,dk)) data.instances.push(mkInst(c,pid,dk)); }
      continue;
    }
    if(c.schedule?.type==="once"){
      if(c.schedule.date!==dk) continue;
      for(const pid of assigneesFor(data,c,wk)){ if(!has(c.id,pid,dk)) data.instances.push(mkInst(c,pid,dk)); }
      continue;
    }
    if(c.schedule?.type!=="fixed") continue;                    // quota tasks: no pre-dated instances
    if(!c.schedule.days.includes(day)) continue;
    if((c.schedule.everyWeeks||1)>1){ // every other week etc., anchored to the week of schedule.anchor
      const a=weekKey(new Date((c.schedule.anchor||dk)+"T12:00:00"), data.settings.weekStart);
      const diffW=Math.round(daysBetween(a,wk)/7); if(((diffW%c.schedule.everyWeeks)+c.schedule.everyWeeks)%c.schedule.everyWeeks!==0) continue; }
    const targets = assigneesFor(data, c, wk);
    for(const pid of targets){ if(!has(c.id,pid,dk)) data.instances.push(mkInst(c,pid,dk)); }
  }
  // routine occurrences for inline-member routines (kid routines)
  for(const r of data.routines){
    if(!r.members || r.tracking!=="interactive" || !r.days.includes(day)) continue;
    for(const pid of r.people){
      if(!data.instances.some(i=>i.rid===r.id && i.pid===pid && i.date===dk)){
        data.instances.push({ id:uid("i"), rid:r.id, pid, date:dk, state:"open",
          checks: r.members.filter(m=>!m.appliesTo||m.appliesTo.includes(pid)).map(()=>false) });
      }
    }
  }
  // subtask visibility memory
  for(const c of data.registry){ if(!c.subtasks) continue;
    data.subMemory[c.id] = data.subMemory[c.id] || {};
  }
  data.lastGen = dk;
  const lc=data.settings.lunchChoices||{}; for(const d of Object.keys(lc)) if(daysBetween(d,dk)>14) delete lc[d];
}
function mkInst(c, pid, dk){
  const inst = { id:uid("i"), cid:c.id, pid, date:dk, state:"open" };
  if(c.policy!=="open"){ inst.state="in_process"; inst.autoClaimed=true; } // static/rotate auto-claim
  if(c.subtasks){ inst.subChecks = visibleSubtasks(c, dk).map(()=>false); }
  return inst;
}
function assigneesFor(data, c, wk){
  const pool = c.assignees?.length ? c.assignees
    : data.people.filter(p=>p.role==="child").map(p=>p.id); // empty list = all kids
  if(c.policy==="static") return pool;                       // each listed person gets their own instance
  if(c.policy==="rotate") return [pool[Math.abs(hash(wk+c.id))%pool.length]];
  if(c.policy==="open")   return c.claimMode==="participatory" ? pool : ["__open__"];
  return [];
}
function hash(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))|0; return h; }
function isExpected(c){ if(c.schedule?.type==="quota") return false; return c.expectation ? c.expectation==="expected" : c.policy!=="open"; } // quota tasks are always extras; static/rotate = yours; open = extra unless overridden
function involvesKid(data,c){ // kid visibility is derived: a child is in Who (or the default open pool is kids)
  if(c.assignees?.length) return c.assignees.some(pid=>data.people.find(p=>p.id===pid)?.role==="child");
  if(c.policy==="open") return true;
  return c.ownerType==="child";
}
function needsAccountable(data,c){ // schema: accountable is required for child and outsourced work
  if(c.assignees?.length) return c.assignees.some(pid=>["child","vendor"].includes(data.people.find(p=>p.id===pid)?.role));
  return involvesKid(data,c) || c.ownerType==="outsourced";
}

/* ---- places (schema v1.9): organizations → groups (class, team) → enrollments; facts live at the level that shares them ---- */
function orgById(D,id){ return (D.settings.orgs||[]).find(o=>o.id===id); }
function groupById(D,id){ return (D.settings.groups||[]).find(g=>g.id===id); }
function groupsOf(D,orgId){ return (D.settings.groups||[]).filter(g=>g.orgId===orgId); }
function enrollmentsOf(D,personId){ return (D.settings.enrollments||[]).filter(e=>e.personId===personId); }
function membersOf(D,groupId){ return (D.settings.enrollments||[]).filter(e=>e.groupId===groupId); }
function groupActive(g,dk){ return (!g.starts||dk>=g.starts)&&(!g.ends||dk<=g.ends); } // season window
function kidPlaces(D,kidId,dk){ // [{org,group,enr}] for everything a kid belongs to (in season on dk, when given)
  return enrollmentsOf(D,kidId).map(e=>{ const g=groupById(D,e.groupId), o=g&&orgById(D,g.orgId); return o&&g&&(!dk||groupActive(g,dk))?{org:o,group:g,enr:e}:null; }).filter(Boolean);
}
function altWeek(anchor,dk){ // every-other-week parity counted from the week of the anchor date (weeks run Monday to Friday)
  const a=weekKey(new Date((anchor||dk)+"T12:00:00"),1), w=weekKey(new Date(dk+"T12:00:00"),1);
  return Math.round(daysBetween(a,w)/7)%2===0;
}
function recurOn(r,dk){ const m=(r.days||{})[String(dowOfKey(dk))]; return m==="every"||(m==="alt"&&altWeek(r.anchor,dk)); }
function groupHours(g,dk){ return (g.hours||{})[String(dowOfKey(dk))]||{}; }
function groupOpen(g,dk,kind){ const d=dowOfKey(dk); const h=g.hours||{}; const any=Object.values(h).some(x=>x.start||x.end); if(!any) return kind==="school"?(d>=1&&d<=5):true; return !!(h[String(d)]?.start||h[String(d)]?.end); }
function usualEnd(g){ const c={}; for(const d of [0,1,2,3,4,5,6]){ const e=(g.hours||{})[String(d)]?.end; if(e) c[e]=(c[e]||0)+1; } return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""; }
function earlyEnd(g,dk){ const e=groupHours(g,dk).end, u=usualEnd(g); return e&&u&&e!==u?e:""; } // only when today's end differs from the group's usual one
function eventsFor(D,dk,kidId){ // dated one-offs that apply to this kid: org-wide, their group, or them personally
  const places=kidPlaces(D,kidId,dk), orgIds=places.map(p=>p.org.id), groupIds=places.map(p=>p.group.id);
  return (D.settings.events||[]).filter(n=>n.date===dk&&(n.personId?n.personId===kidId:n.groupId?groupIds.includes(n.groupId):orgIds.includes(n.orgId))).sort((a,b)=>(a.time||"").localeCompare(b.time||"")||a.id.localeCompare(b.id));
}
function closedFor(D,dk,place){ return (D.settings.events||[]).filter(n=>n.date===dk&&n.kind==="closed"&&(n.groupId?n.groupId===place.group.id:n.orgId===place.org.id)); }
function dpOfTime(t){ if(!t) return null; const [h,m]=t.split(":").map(Number), mm=h*60+m; let cur="morning"; for(const d of dayparts()){ const [hh,m2]=d.start.split(":").map(Number); if(mm>=hh*60+m2) cur=d.key; } return cur; }
function lunchFor(dk){ // {items:[...]} | {msg} | null when the menu file isn't there at all
  const L=state.lunch; if(!L) return null;
  const ws=weekKey(new Date(dk+"T12:00:00"),1);
  if(L.weekStart!==ws) return {msg:"Lunch menu not loaded for this week"};
  const items=L.days?.[dk]; if(!items) return {msg:"No school lunch posted"};
  if(!items.length) return {msg:"No school lunch today"};
  return {items};
}
async function loadLunch(){ // same-origin file written by .github/workflows/lunch.yml in the published repo; absent until the first run
  try{ const r=await fetch("lunch.json?v="+todayKey(new Date()),{cache:"no-store"}); if(!r.ok) throw 0; state.lunch=await r.json(); }
  catch(e){ state.lunch=null; }
}
function lunchChoice(data,dk,kidId){ return data.settings.lunchChoices?.[dk]?.[kidId]||""; }
window.setLunch=(kidId,v)=>{ const S=state.data.settings, dk=todayKey(state.now); S.lunchChoices=S.lunchChoices||{}; S.lunchChoices[dk]=S.lunchChoices[dk]||{};
  if(S.lunchChoices[dk][kidId]===v) delete S.lunchChoices[dk][kidId]; else S.lunchChoices[dk][kidId]=v; save(); render(); };
const bringTxt=b=>b?` <span class="muted">· bring ${b}</span>`:"";
function placeLabel(org,g){ const v=(g.room||"").trim(); if(!v) return ""; const lbl={school:"Room",sports:"Field",dance:"Studio"}[org.kind]; return /^\d+[a-z]?$/i.test(v)&&lbl?`${lbl} ${v}`:v; }
function kidDay(D,kid,dk){ // what this day holds at the kid's places: items carry a daypart when they have a time, else they are all-day
  const all=kidPlaces(D,kid.id,dk), places=[], closed=[], items=[];
  for(const p of all){ const c=closedFor(D,dk,p); if(c.length){ closed.push({place:p,ev:c[0]}); continue; } if(groupOpen(p.group,dk,p.org.kind)) places.push(p); }
  for(const p of places){
    const who=p.org.kind==="school"?"":`${p.group.name||p.org.name} `;
    for(const r of p.group.recurring||[]) if(recurOn(r,dk)) items.push({dp:dpOfTime(r.time),ic:p.org.kind==="school"?"🏫":p.org.kind==="sports"?"⚾":p.org.kind==="dance"?"🩰":"📍",text:`${who}<b>${r.name||(p.org.kind==="school"?"Special":"Practice")}</b>${r.time?` ${fmtHour(r.time)}`:" today"}${p.group.room&&r.time?` · ${placeLabel(p.org,p.group)}`:""}${bringTxt(r.bring)}`,name:r.name||(p.org.kind==="school"?"Special":"Practice"),bring:r.bring,time:r.time,place:p});
    const e=earlyEnd(p.group,dk); if(e) items.push({dp:null,ic:"🕐",text:`Pickup at <b>${fmtHour(e)}</b> today`,early:e});
  }
  for(const n of eventsFor(D,dk,kid.id)){ if(n.kind==="closed") continue;
    const p=n.groupId?places.find(x=>x.group.id===n.groupId):places.find(x=>x.org.id===n.orgId), who=p&&p.org.kind!=="school"?`${p.group.name||p.org.name} `:"";
    items.push({dp:dpOfTime(n.time),ic:n.kind==="event"?"📅":"📌",text:`${who}${n.time?`<b>${fmtHour(n.time)}</b> `:""}${n.text}${n.location?` · ${n.location}`:""}${bringTxt(n.bring)}`,event:n,bring:n.bring,time:n.time,place:p}); }
  const lunch=places.some(p=>p.org.lunch)?lunchFor(dk):null;
  return { places, closed, items, lunch };

function placesStripHTML(kid,dk,dp){ // per daypart card: Morning holds all-day items, closures, pickup and lunch; timed items land in their own block
  const D=state.data, day=kidDay(D,kid,dk), lines=[];
  if(dp==="morning"){
    for(const c of day.closed) lines.push(`<div class="sl"><span class="ic">🚫</span><span>No ${c.place.org.kind==="school"?"school":c.place.group.name} today${c.ev.text?` · ${c.ev.text}`:""}</span></div>`);
    for(const it of day.items.filter(x=>!x.dp)) lines.push(`<div class="sl"><span class="ic">${it.ic}</span><span class="txt">${it.text}</span></div>`);
    if(day.lunch){ const ch=lunchChoice(D,dk,kid.id);
      lines.push(`<div class="sl"><span class="ic">🍽</span>${day.lunch.items?`<span class="txt">${day.lunch.items.join(" · ")}</span>`:`<span class="txt muted">${day.lunch.msg}</span>`}</div>
      <div class="sl"><span class="muted" style="font-size:.85rem">Lunch today:</span><span class="seg"><button class="${ch==="buy"?"on":""}" onclick="setLunch('${kid.id}','buy')">Buying</button><button class="${ch==="pack"?"on":""}" onclick="setLunch('${kid.id}','pack')">Packing</button></span></div>`); }
  }
  for(const it of day.items.filter(x=>x.dp===dp)) lines.push(`<div class="sl"><span class="ic">${it.ic}</span><span class="txt">${it.text}</span></div>`);

    for(const c of nd.closed) lines.push(`<div class="sl"><span class="ic">🚫</span><span>${t} no ${c.place.org.kind==="school"?"school":c.place.group.name}</span></div>`);
    for(const it of nd.items.filter(x=>x.event||x.early||x.bring)) lines.push(`<div class="sl"><span class="ic">${it.ic}</span><span class="txt">${t} ${it.text.replace(" today","")}</span></div>`);
    const sp=nd.items.filter(x=>x.name&&!x.bring&&!x.time).map(x=>x.name); if(sp.length) lines.push(`<div class="sl"><span class="ic">🏫</span><span>${t} ${sp.join(" + ")}</span></div>`);
  }
  return lines.length?`<div class="school">${lines.join("")}</div>`:"";
}
function contactChips(list){ return (list||[]).filter(c=>c.name||c.phone||c.email).map(c=>`<span class="chip">${c.name||c.role||""}${c.role&&c.name?` <i>${c.role}</i>`:""}${c.phone?` <a href="tel:${c.phone.replace(/[^\d+]/g,"")}">${c.phone}</a>`:""}${c.email?` <a href="mailto:${c.email}">${c.email}</a>`:""}</span>`).join(""); }
function linkChips(list){ return (list||[]).filter(l=>l.url).map(l=>`<a class="chip" href="${l.url.match(/^https?:/)?l.url:"https://"+l.url}" target="_blank" rel="noopener">${l.label||l.url}</a>`).join(""); }
function renderAdultSchool(dk){ // today at the kids' places: what's on the schedule, pickup, lunch decision, closures; the directory (teachers, links) stays in Settings
  const D=state.data, kids=D.people.filter(p=>p.role==="child");
  const rows=kids.map(k=>{ const day=kidDay(D,k,dk); if(!day.places.length&&!day.closed.length) return "";
    const mins=t=>{ if(!t) return 0; const [h,m]=t.split(":").map(Number); return h*60+m; };
    const bits=[]; // ordered through the day: closures and the school name first, all-day items, the lunch decision, then everything with a time (pickup included) in time order
    for(const c of day.closed) bits.push({t:-2,h:`🚫 ${c.place.org.name} closed${c.ev.text?` · ${c.ev.text}`:""}`});
    for(const p of day.places.filter(p=>p.org.kind==="school")){ bits.push({t:-1,h:`🏫 ${p.group.name||p.org.name}`});
      const end=groupHours(p.group,dk).end; if(end) bits.push({t:mins(end),h:`🕐 out ${fmtHour(end)}${earlyEnd(p.group,dk)?" (early)":""}`}); }
    for(const it of day.items.filter(it=>!it.early)) bits.push({t:it.time?mins(it.time):0,h:`${it.ic} ${it.text}`});

/* ---- dayparts: four quarters of the waking day + anytime ---- */
const DP_ORDER={morning:0, midday:1, afternoon:2, evening:3};
const DP_KEYS=["morning","midday","afternoon","evening"];
const DEFAULT_DAYPARTS=()=>[ // 7 to 23 waking, four blocks, eight hours of sleep
  {key:"morning",label:"Morning",icon:"☀️",start:"07:00"},{key:"midday",label:"Midday",icon:"🌤️",start:"11:00"},
  {key:"afternoon",label:"Afternoon",icon:"⛅",start:"15:00"},{key:"evening",label:"Evening",icon:"🌙",start:"19:00"} ];
function dayparts(){ return state.data?.settings?.dayparts||DEFAULT_DAYPARTS(); }
function dpDef(key){ return dayparts().find(d=>d.key===key)||{key,label:key,icon:"",start:"00:00"}; }
function dpLabel(key,person){ if(key==="anytime") return "Anytime"; const o=person?.daypartLabels?.[key]; return o||dpDef(key).label; }
function dpIcon(key){ return key==="anytime"?"⏳":dpDef(key).icon; }
function daypartNow(){ const now=new Date(), m=now.getHours()*60+now.getMinutes(); let cur="morning";
  for(const d of dayparts()){ const [h,mm]=d.start.split(":").map(Number); if(m>=h*60+mm) cur=d.key; } return cur; }
function fmtHour(t){ const [h,m]=t.split(":").map(Number); const ap=h>=12?"pm":"am", hh=((h+11)%12)+1; return m?`${hh}:${String(m).padStart(2,"0")}${ap}`:`${hh}${ap}`; }
function dpRange(key){ // "7am-11am": the block's start to the next block's start, so ranges meet; the evening ends when the 16-hour waking day does
  const dps=dayparts(), i=dps.findIndex(d=>d.key===key); if(i<0) return "";
  const toM=t=>{ const [h,m]=t.split(":").map(Number); return h*60+m; };
  const startM=toM(dps[i].start), nextM=i<3?toM(dps[i+1].start):toM(dps[0].start)+16*60;
  const endM=(nextM%1440+1440)%1440;
  const fmt=mm=>fmtHour(`${String(Math.floor(mm/60)).padStart(2,"0")}:${String(mm%60).padStart(2,"0")}`);

function dayArcHTML(){ // sun (or moon) sits on the current daypart's stop along an arc; family labels

  const pt=t=>{ const a=Math.PI*(1-t); return [cx+rx*Math.cos(a), cy-ry*Math.sin(a)]; };
  const stops=dps.map((d,i)=>({...d, t:(i*2+1)/8}));
  const on=stops.find(st=>st.key===cur)||stops[0]; const [mx,my]=pt(on.t);
  return `<svg class="dayarc" viewBox="0 0 ${W} ${H+34}" aria-label="Time of day: ${dpLabel(cur)}">
    <path d="M ${pt(0)[0]} ${pt(0)[1]} A ${rx} ${ry} 0 0 1 ${pt(1)[0]} ${pt(1)[1]}" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
    ${stops.map(st=>{ const [x,y]=pt(st.t), o=st.key===cur; return `<g><circle cx="${x}" cy="${y}" r="${o?8:6}" fill="${o?"var(--adult)":"var(--card)"}" stroke="var(--adult)" stroke-width="3"/><text x="${x}" y="${y+30}" text-anchor="middle" font-size="16" font-family="Fredoka" fill="${o?"var(--ink)":"var(--muted)"}" font-weight="${o?"600":"400"}">${st.label}</text></g>`; }).join("")}

const HUE_PRESETS=[{h:350,n:"pink"},{h:68,n:"sunny"},{h:190,n:"teal"},{h:262,n:"blue"},{h:305,n:"purple"}]; // rainbow order; no green (reserved for money)
function repairUtcDates(data){ // v0.24 stamped dates in UTC, so anything done after 5pm Pacific landed on the next calendar day

  const sameSlot=(a,b)=>a!==b&&a.date===b.date&&a.pid===b.pid&&(a.rid?a.rid===b.rid:(a.cid===b.cid&&!b.rid));
  for(const i of data.instances){
    const ts=i.completedAt||i.verifiedAt||i.startedAt; if(!ts||!i.date) continue;
    const real=todayKey(new Date(ts)); if(real>=i.date) continue;
